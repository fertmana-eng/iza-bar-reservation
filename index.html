<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Installable as an app on the phone (owner, Nov 2026): book.webmanifest -->
<link rel="manifest" href="book.webmanifest">
<meta name="theme-color" content="#f6f4ef">
<link rel="apple-touch-icon" href="assets/icons/book-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הזמנות עיזה בר">
<title>הזמנת שולחן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  /* Same look as the manager's tablet screen (admin.html): light background, white
     rounded boxes, dark green buttons, the system font, the red IZAZOO logo.
     (Heebo is still loaded: the booking card picture is drawn with it.) */
  :root {
    --paper: #f6f4ef;
    --card: #ffffff;
    --ink: #1f1e1c;
    --ink-soft: #6b6862;
    --line: #e4e0d6;
    --muted: #6b6862;
    --field-bg: #ffffff;
    --field-border: #e4e0d6;
    --accent: #2f4a3d;
    --danger: #7a2e2e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  .header-band {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
    text-align: center;
  }
  .page { max-width: 420px; width: 100%; margin: 0 auto; padding: 16px 16px 64px; }
  #stepArea { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 18px; }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .venue-logo { display: block; height: 24px; width: auto; }
  .venue-name { margin: 0; }
  .slash-big { font-weight: 700; font-size: 22px; color: var(--line); }
  .venue-tag { color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap; }

  .notice { font-size: 14px; line-height: 1.5; color: var(--ink-soft); text-align: center; margin: -16px 0 20px; }
  /* same "waiting for approval" colours as the manager's tablet (admin.html --pending-*) */
  #approvalNote { margin: 0 0 16px; text-align: center; font-size: 15px; line-height: 1.5; padding: 10px 12px; background: #fffaf0; border: 1px solid #e2c27a;
    border-radius: 10px; color: #8a5a00; font-weight: 600; }

  /* Table or bar */
  .seating { display: grid; grid-template-columns: 1fr 1fr; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 12px; }
  .seating button { all: unset; box-sizing: border-box; text-align: center; padding: 11px 0; border-radius: 9px; font-size: 15.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer; font-family: inherit; }
  .seating button.on { background: var(--accent); color: #fff; }
  .seating button:focus-visible { outline: 2px solid var(--accent); }

  /* The three choice boxes (guests, date, time), side by side */
  .pickers { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--field-border); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
  .pick {
    all: unset; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    min-height: 64px; padding: 8px 4px; background: #fff; cursor: pointer; text-align: center; font-family: inherit;
  }
  .pick + .pick { border-right: 1px solid var(--field-border); }
  .pick-value { font-size: 15.5px; font-weight: 700; color: var(--ink); white-space: nowrap; }
  .pick:not(.set) .pick-value { font-weight: 500; color: var(--muted); }
  .pick-caret { font-size: 11px; color: var(--muted); line-height: 1; }
  .pick:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* Panel that slides up from the bottom of the screen */
  .sheet-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(31, 30, 28, .38); display: flex; align-items: flex-end; justify-content: center; }
  .sheet {
    width: 100%; max-width: 420px; max-height: 88vh; overflow-y: auto; background: var(--card);
    border-radius: 18px 18px 0 0; padding: 14px 18px calc(20px + env(safe-area-inset-bottom));
    animation: sheet-up .18s ease-out;
  }
  @keyframes sheet-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sheet-title { font-size: 18px; font-weight: 700; }
  .sheet-close { background: none; border: none; font-size: 18px; color: var(--ink-soft); padding: 6px 8px; cursor: pointer; font-family: inherit; }
  .choice-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .choice-grid button {
    all: unset; box-sizing: border-box; text-align: center; padding: 12px 0; border: 1px solid var(--field-border);
    border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; font-family: inherit;
  }
  .choice-grid button.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
  .choice-grid button:disabled { color: #cfc9bd; border-color: var(--line); cursor: default; }

  .bar-offer { text-align: center; margin: -6px 0 16px; }
  .bar-offer p { font-size: 14.5px; color: var(--ink); margin: 0 0 4px; }
  .details { border-top: 1px solid var(--line); margin-top: 22px; padding-top: 18px; scroll-margin-top: 70px; }
  .found-title { font-size: 17px; font-weight: 700; color: var(--accent); margin: 0 0 16px; text-align: center; }
  .rules { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 0 16px; }
  .rules p { font-size: 14px; line-height: 1.55; color: var(--ink); margin: 0 0 6px; }
  .rules p:last-child { margin-bottom: 0; }

  .step-question { font-size: 21px; font-weight: 700; margin: 0 0 24px; }

  label {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field { margin-bottom: 18px; }

  input, textarea {
    width: 100%;
    background: var(--field-bg);
    border: 1px solid var(--field-border);
    border-radius: 10px;
    padding: 13px 14px;
    font-size: 17px;
    font-family: inherit;
    color: var(--ink);
  }
  input::placeholder, textarea::placeholder { color: #b3ab9c; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: none; }

  button.primary {
    width: 100%;
    height: 46px;
    border-radius: 10px;
    font-size: 15.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-top: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
  }
  button.primary:disabled { opacity: 0.45; }

  /* Calendar */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-month { font-weight: 700; font-size: 17px; }
  .cal-nav { background: none; border: none; color: var(--ink); font-size: 20px; padding: 4px 10px; cursor: pointer; }
  .cal-nav:disabled { color: var(--field-border); cursor: default; }
  .cal-weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-weekdays div { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding-bottom: 8px; }
  .cal-grid button {
    all: unset; box-sizing: border-box; width: 100%; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--ink); border-radius: 50%; cursor: pointer;
  }
  .cal-grid button:disabled { color: #cfc9bd; cursor: default; }
  .cal-grid button.today { border: 1px solid var(--accent); }
  .cal-grid button.selected { background: var(--accent); color: #fff; font-weight: 700; }

  .warning { color: var(--danger); font-size: 14px; margin-top: 16px; text-align: center; }

  .hint { text-align: center; font-size: 12px; color: var(--muted); margin: 0 0 6px; }

  .error { color: var(--danger); font-size: 13px; margin-top: 8px; }

  .success { text-align: center; padding: 8px 0 28px; }
  .success h2 { font-family: inherit; font-weight: 900; font-size: 24px; margin: 0 0 10px; }
  .success p { font-size: 15px; margin: 4px 0; }
  .card-fallback[hidden] { display: none; }
  .btn-outline {
    width: 100%; height: 48px; border-radius: 10px; font-size: 15px; font-weight: 600;
    font-family: inherit; cursor: pointer; margin-top: 10px;
    background: #fff; color: var(--ink); border: 1px solid var(--field-border);
  }
  a.btn-outline[hidden] { display: none; }
  a.btn-outline, a.btn-whatsapp { display: flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box; }
  .card-preview { display: block; width: min(320px, 86%); margin: 0 auto; border-radius: 6px; box-shadow: 0 6px 24px rgba(28,22,16,.18); }
  .card-preview[hidden] { display: none; }
  .my-bookings { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 6px; margin: 0 0 22px; }
  .my-title { font-weight: 700; font-size: 14px; color: var(--ink-soft); margin: 0 0 6px; }
  .my-booking { display: flex; justify-content: space-between; align-items: center; min-height: 44px; color: var(--ink);
    text-decoration: none; font-weight: 600; font-size: 15px; border-top: 1px solid var(--line); }
  .my-booking:first-of-type { border-top: none; }
  .my-booking span { color: var(--ink-soft); font-weight: 400; font-size: 13px; }
  .btn-whatsapp {
    width: 100%; height: 48px; border-radius: 10px; font-size: 15px; font-weight: 700;
    font-family: inherit; cursor: pointer; margin-top: 4px;
    background: #2fae60; color: #fff; border: none;
  }
</style>
</head>

<div class="header-band">
  <div class="title-row">
    <h1 class="venue-name"><img class="venue-logo" src="assets/izazoo-logo-red.png" alt="IZAZOO" width="168" height="24"></h1>
    <span class="slash-big">//</span>
    <span class="venue-tag">עיזה בר</span>
  </div>
</div>
<div class="page" id="page">
  <div id="stepArea"><p style="text-align:center; color:var(--muted);">טוען...</p></div>
</div>

<!-- ================= CONFIGURATION ================= -->
<script>
  const SUPABASE_URL = "https://brpovhypzsgwsnuenpfj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_FG6kYV7D4D7iDXYYHGrysw_bJ-ag_0e";

<!-- =================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="card.js"></script>
<script>
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);


const stepArea = document.getElementById('stepArea');
const BOOKING_WINDOW_DAYS = 30;
const BAR_MAX = 4;
const WEEKDAY_LETTERS = ['א','ב','ג','ד','ה','ו','ש'];
let pageSettings = null;
let viewMonth, minDate, maxDate;
let warning = null;    // shown under the three boxes
let found = false;     // there is room for the chosen guests and date: the details form is open
let offerBar = false;  // table chosen, no table left, but the bar has room

const formData = { seating: null, placed: null, date: null, time: null, name: '', phone: '', guests: null, note: '', bookingId: null, pending: false };

// All dates and times are the restaurant's (Israel), whatever the phone's
// time zone. Calendar days are kept as 'YYYY-MM-DD' text built from the day's
// own numbers (never toISOString, which shifts to UTC and moved every day back).
// The same phone rule the database checks (supabase/migrations/08_booking_limits.sql)
const PHONE_OK = /^[0-9+() -]{7,20}$/;

function israelNow() {
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Jerusalem', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
  }).formatToParts(new Date()).map(p => [p.type, p.value]));
  return { date: `${parts.year}-${parts.month}-${parts.day}`, time: `${parts.hour}:${parts.minute}` };
}
// Customer text is shown inside HTML: turn < > & " ' into harmless characters first,
// so a name or note can never become code on the page.
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function todayStr() { return israelNow().date; }
function pad2(n) { return String(n).padStart(2, '0'); }
function toDateStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function fromDateStr(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function formatDisplay(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric' });
}
function timeOptions(start, end) {
  const opts = [];
  let [h, m] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  while (h < eh || (h === eh && m <= em)) {
    opts.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
    m += 15;
    if (m >= 60) { m = 0; h += 1; }
  }
  return opts;
}

async function getSettings() {
  const { data: settingsRows } = await db.from('settings')
    .select('key,value').in('key', ['arrival_start','arrival_end','booking_cutoff']);
  const settings = Object.fromEntries((settingsRows || []).map(r => [r.key, r.value]));
  return {
    start: settings.arrival_start || '17:00',
    end: settings.arrival_end || '21:00',
    cutoff: settings.booking_cutoff || '20:00'
  };
}

// One screen, like the big Israeli booking sites (owner, Nov 2026): three boxes
// (guests, date, time) that open a panel from the bottom, "מצאו לי מקום", and when
// there is room the name/phone form opens on the same screen. No default values.
async function init() {
  pageSettings = await getSettings();
  const now = israelNow();
  minDate = fromDateStr(now.date);
  maxDate = new Date(minDate); maxDate.setDate(maxDate.getDate() + BOOKING_WINDOW_DAYS);
  const initial = fromDateStr(now.date);
  if (now.time > pageSettings.cutoff) initial.setDate(initial.getDate() + 1);
  viewMonth = new Date(initial.getFullYear(), initial.getMonth(), 1);
  renderBooking();
}

// Upcoming bookings this phone made, shown at the top of the page.
function myBookingsHtml() {
  const mine = myBookings().filter(b => b.date >= todayStr()).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  return mine.length ? `<div class="my-bookings" id="myBookings">
      <p class="my-title">ההזמנות שלי</p>
      ${mine.map(b => `<a class="my-booking" href="booking.html#${encodeURIComponent(b.token)}">${formatDisplay(b.date)} · ${esc(b.time)} · ${Number(b.guests)} סועדים<span>לצפייה ושינוי ‹</span></a>`).join('')}
    </div>` : '';
}

function dateLabel(dStr) { return `${WEEKDAY_LETTERS[fromDateStr(dStr).getDay()]}׳ ${formatDisplay(dStr)}`; }
function closedToday(dStr) { const now = israelNow(); return dStr === now.date && now.time > pageSettings.cutoff; }

function renderBooking() {
  closeSheet();
  // the bar takes groups of up to 4; the number is never changed for the customer (owner, Nov 2026)
  const barOver = formData.seating === 'bar' && formData.guests > BAR_MAX;
  const ready = formData.seating && formData.guests && formData.date && formData.time && !barOver;
  const box = (id, label, value) => `<button type="button" class="pick${value ? ' set' : ''}" id="${id}" aria-label="${label}: ${value || 'לא נבחר'}">
      <span class="pick-value">${value || label}</span><span class="pick-caret" aria-hidden="true">▾</span></button>`;
  stepArea.innerHTML = `
    ${myBookingsHtml()}
    <p class="step-question">הזמנת שולחן</p>
    <p class="notice" id="indoorNote">הזמנה לישיבה בפנים בלבד.<br>בחוץ ללא הזמנה, לפי מקום פנוי.</p>
    <div class="seating" role="radiogroup" aria-label="איפה לשבת?">
      <button type="button" role="radio" aria-checked="${formData.seating === 'table'}" class="${formData.seating === 'table' ? 'on' : ''}" data-seating="table">שולחן</button>
      <button type="button" role="radio" aria-checked="${formData.seating === 'bar'}" class="${formData.seating === 'bar' ? 'on' : ''}" data-seating="bar">בר</button>
    </div>
    <div class="pickers">
      ${box('pickGuests', 'סועדים', formData.guests ? `${formData.guests} סועדים` : '')}
      ${box('pickDate', 'תאריך', formData.date ? dateLabel(formData.date) : '')}
      ${box('pickTime', 'שעה', formData.time || '')}
    </div>
    ${barOver ? `<p class="warning" id="barLimit">בבר אפשר עד ${BAR_MAX} סועדים. הקטינו את מספר הסועדים או בחרו שולחן.</p>` : ''}
    ${warning ? `<p class="warning" id="formWarning">${warning}</p>` : ''}
    ${offerBar ? `<div class="bar-offer" id="barOffer"><p>אין שולחנות פנויים בתאריך הזה, אבל יש מקום בבר.</p>
      <button type="button" class="btn-outline" id="switchBar">להזמין בבר</button></div>` : ''}
    ${found ? detailsHtml() : `<button type="button" class="primary" id="findBtn" ${ready ? '' : 'disabled'}>מצאו לי מקום</button>`}
  `;
  stepArea.querySelectorAll('[data-seating]').forEach(b => b.addEventListener('click', () => {
    formData.seating = b.dataset.seating;
    choiceChanged();
  }));
  document.getElementById('pickGuests').addEventListener('click', openGuestsSheet);
  document.getElementById('pickDate').addEventListener('click', openDateSheet);
  document.getElementById('pickTime').addEventListener('click', openTimeSheet);
  document.getElementById('switchBar')?.addEventListener('click', () => {
    formData.seating = 'bar'; offerBar = false; renderBooking(); findPlace();
  });
  if (found) bindDetails();
  else document.getElementById('findBtn').addEventListener('click', findPlace);
}
// Any change to guests, date or time means a new search.
function choiceChanged() { found = false; offerBar = false; warning = null; renderBooking(); }

// A panel that slides up from the bottom of the screen (closes on ✕ or a tap outside it).
function openSheet(title, body, bind) {
  closeSheet();
  const el = document.createElement('div');
  el.className = 'sheet-backdrop'; el.id = 'sheet';
  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${title}">
    <div class="sheet-head"><span class="sheet-title">${title}</span><button type="button" class="sheet-close" id="sheetClose" aria-label="סגירה">✕</button></div>
    <div class="sheet-body"></div></div>`;
  document.body.appendChild(el);
  el.addEventListener('click', e => { if (e.target === el) closeSheet(); });
  el.querySelector('#sheetClose').addEventListener('click', closeSheet);
  const fill = () => { el.querySelector('.sheet-body').innerHTML = body(); bind(el, fill); };
  fill();
}
function closeSheet() { const s = document.getElementById('sheet'); if (s) s.remove(); }

function openGuestsSheet() {
  openSheet('כמה תהיו?', () => `
    <div class="choice-grid">${Array.from({ length: 10 }, (_, i) => i + 1).map(n =>
      `<button type="button" data-guests="${n}" class="${n === formData.guests ? 'selected' : ''}">${n}</button>`).join('')}</div>
    <p class="hint">עד 10 סועדים בהזמנה</p>`,
  el => el.querySelectorAll('[data-guests]').forEach(b => b.addEventListener('click', () => {
    formData.guests = Number(b.dataset.guests); choiceChanged();
  })));
}

function calendarHtml() {
  const monthLabel = viewMonth.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' });
  const daysInMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0).getDate();
  const nextMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1);
  const prevDisabled = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 0) < minDate;
  const nextDisabled = nextMonth > maxDate;
  let cells = '';
  for (let i = 0; i < viewMonth.getDay(); i++) cells += '<div></div>';
  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), day);
    const dStr = toDateStr(d);
    const disabled = d < minDate || d > maxDate || closedToday(dStr);
    const classes = [];
    if (dStr === todayStr()) classes.push('today');
    if (dStr === formData.date) classes.push('selected');
    cells += `<button type="button" class="${classes.join(' ')}" data-date="${dStr}" ${disabled ? 'disabled' : ''}>${day}</button>`;
  }
  return `
    <div class="cal-head">
      <button type="button" class="cal-nav" id="prevMonth" ${prevDisabled ? 'disabled' : ''}>‹</button>
      <span class="cal-month">${monthLabel}</span>
      <button type="button" class="cal-nav" id="nextMonth" ${nextDisabled ? 'disabled' : ''}>›</button>
    </div>
    <div class="cal-weekdays">${WEEKDAY_LETTERS.map(l => `<div>${l}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>`;
}
function openDateSheet() {
  openSheet('מתי מגיעים?', calendarHtml, (el, fill) => {
    el.querySelector('#prevMonth').addEventListener('click', () => { viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1); fill(); });
    el.querySelector('#nextMonth').addEventListener('click', () => { viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1); fill(); });
    el.querySelectorAll('.cal-grid button:not(:disabled)').forEach(b => b.addEventListener('click', () => {
      formData.date = b.dataset.date;
      if (formData.time && timeToMinutes(formData.time) < earliestArrival()) formData.time = null;   // too early for today
      choiceChanged();
    }));
  });
}

function openTimeSheet() {
  openSheet('באיזו שעה?', () => {
    const min = earliestArrival();
    return `<div class="choice-grid">${timeOptions(pageSettings.start, pageSettings.end).map(t =>
      `<button type="button" data-time="${t}" class="${t === formData.time ? 'selected' : ''}" ${timeToMinutes(t) < min ? 'disabled' : ''}>${t}</button>`).join('')}</div>
      <p class="hint">שעת הגעה${formData.date === todayStr() ? ' להיום' : ''}: בין ${minutesToTime(Math.max(min, timeToMinutes(pageSettings.start)))} ל-${pageSettings.end}</p>`;
  }, el => el.querySelectorAll('[data-time]:not(:disabled)').forEach(b => b.addEventListener('click', () => {
    formData.time = b.dataset.time; choiceChanged();
  })));
}

async function findPlace() {
  const btn = document.getElementById('findBtn');
  btn.disabled = true;
  btn.textContent = 'בודק זמינות...';
  // the page may have stayed open: check the clock again
  if (closedToday(formData.date)) {
    warning = 'ההזמנות המקוונות ליום זה נסגרו. בחרו תאריך אחר.';
    formData.date = null; formData.time = null;
    return renderBooking();
  }
  if (timeToMinutes(formData.time) < earliestArrival()) {
    warning = 'השעה שבחרתם כבר עברה. בחרו שעה מאוחרת יותר.';
    formData.time = null;
    return renderBooking();
  }
  const { data, error } = await db.rpc('check_availability', { p_date: formData.date, p_guests: formData.guests, p_seating: formData.seating });
  if (error) {
    console.error('Availability check error:', error);
    warning = 'שגיאה בבדיקת זמינות, נסו שוב.';
  } else if (data === 'yes') {
    found = true;
  } else if (data === 'bar') {
    offerBar = true;
  } else {
    warning = `אין מקום ${formData.seating === 'bar' ? 'בבר ' : ''}ל-${formData.guests} סועדים בתאריך הזה. נסו תאריך אחר${formData.seating === 'bar' ? '' : ' או קבוצה קטנה יותר'}.`;
  }
  renderBooking();
  if (found) document.getElementById('details').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function detailsHtml() {
  return `
    <div class="details" id="details">
      <p class="found-title">יש מקום! נשאר רק להשאיר פרטים</p>
      <div class="field">
        <label for="nameInput">שם</label>
        <input id="nameInput" type="text" placeholder="שם פרטי ושם משפחה" maxlength="80" value="${esc(formData.name)}" autocomplete="name">
      </div>
      <div class="field">
        <label for="phoneInput">טלפון</label>
        <input id="phoneInput" type="tel" placeholder="050-0000000" maxlength="20" value="${esc(formData.phone)}" autocomplete="tel">
      </div>
      <div class="field">
        <label for="noteInput">הערה (לא חובה)</label>
        <textarea id="noteInput" rows="2" maxlength="300" placeholder="לדוגמה: יום הולדת, כיסא תינוק...">${esc(formData.note)}</textarea>
      </div>
      <div class="rules" id="rules">
        <p>נחכה למאחרים עד 15 דקות משעת ההזמנה. אחר כך לא נוכל להתחייב שהמקום יישמר לכם 🙏</p>
        <p>הקדמתם? ייתכן שתצטרכו להמתין שהמקום שלכם יתפנה.</p>
      </div>
      <div id="submitError" class="error" style="display:none;"></div>
      <button type="button" class="primary" id="submitBtn">שריינו לי שולחן</button>
    </div>`;
}
function bindDetails() {
  // what is typed is kept if the customer changes a choice and searches again
  for (const [id, key] of [['nameInput', 'name'], ['phoneInput', 'phone'], ['noteInput', 'note']])
    document.getElementById(id).addEventListener('input', e => { formData[key] = e.target.value; });
  document.getElementById('submitBtn').addEventListener('click', submitBooking);
}

function timeToMinutes(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}
function minutesToTime(mins) {
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

// Same-day arrivals start at least 30 minutes from now, rounded up to the next quarter hour.
function earliestArrival() {
  const now = israelNow();
  let min = timeToMinutes(pageSettings.start);
  if (formData.date === now.date) min = Math.max(min, Math.ceil((timeToMinutes(now.time) + 30) / 15) * 15);
  return min;
}

async function submitBooking() {
  const btn = document.getElementById('submitBtn');
  const errEl = document.getElementById('submitError');
  errEl.style.display = 'none';
  formData.name = document.getElementById('nameInput').value.trim();
  formData.phone = document.getElementById('phoneInput').value.trim();
  formData.note = document.getElementById('noteInput').value.trim();
  const problem = !formData.name || !formData.phone ? 'נא למלא שם וטלפון.' : !PHONE_OK.test(formData.phone) ? 'מספר הטלפון לא תקין.' : null;
  if (problem) { errEl.textContent = problem; errEl.style.display = 'block'; return; }
  btn.disabled = true;
  btn.textContent = 'שולח...';

  const { data, error } = await db.rpc('book_reservation', {
    p_date: formData.date,
    p_time: formData.time,
    p_name: formData.name,
    p_phone: formData.phone,
    p_guests: formData.guests,
    p_note: formData.note || null,
    p_seating: formData.seating
  });

  if (error || !data || !data[0]) {
    console.error('Booking error:', error);
    errEl.textContent = 'שגיאה: ' + (error ? (error.message || JSON.stringify(error)) : 'תשובה ריקה מהשרת');
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'שריינו לי שולחן';
    return;
  }

  const result = data[0].result;

  if (result === 'confirmed' || result === 'pending') {
    // 'pending': a same-day request made between 16:00 and 20:00, held until the manager approves it
    const pending = result === 'pending';
    formData.bookingId = data[0].reservation_id;
    formData.pending = pending;
    formData.placed = data[0].seating || formData.seating;   // where the booking ended up: 'table' or 'bar'
    const token = data[0].booking_token;     // the customer's private link (booking.html#<token>)
    const title = pending ? 'הבקשה התקבלה' : 'ההזמנה אושרה';
    if (token) rememberBooking({ token, date: formData.date, time: formData.time, guests: formData.guests });
    shareText = `${pending ? 'בקשת הזמנה (ממתינה לאישור)' : 'אישור הזמנה'} - ${BUSINESS_NAME}\n${formData.name}, ${placeText(formData.placed, formData.guests)}\n${formatDisplay(formData.date)} בשעה ${formData.time}`
      + (token ? `\nלצפייה, שינוי או ביטול: ${bookingUrl(token)}` : '');
    const waText = encodeURIComponent(shareText);
    stepArea.innerHTML = `
      ${pending ? '<p id="approvalNote"><span aria-hidden="true">⏳ </span>הזנת הזמנה בשעה זו מחייבת אישור שלנו, נעדכן אתכם בהקדם!</p>' : ''}
      <div class="success">
        <img class="card-preview" id="cardPreview" hidden
          alt="${title}${pending ? ' וממתינה לאישור' : ''}: ${esc(formData.name)}, ${placeText(formData.placed, formData.guests)}, ${formatDisplay(formData.date)} בשעה ${formData.time}">
        <div class="card-fallback" id="cardFallback" hidden>
          <h2>${title}</h2>
          ${pending ? '<p>ממתינה לאישור. נעדכן אתכם בוואטסאפ.</p>' : ''}
          <p>${esc(formData.name)}, ${placeText(formData.placed, formData.guests)}</p>
          <p>${formatDisplay(formData.date)} בשעה ${formData.time}</p>
        </div>
      </div>
      <a class="btn-whatsapp" id="waLink" href="https://wa.me/?text=${waText}" target="_blank" rel="noopener">שליחה לוואטסאפ שלי</a>
      ${token ? `<a class="btn-outline" id="waLinkText" href="https://wa.me/?text=${waText}" target="_blank" rel="noopener" hidden>שליחת הקישור להזמנה לוואטסאפ</a>` : ''}
      ${pending ? '' : IS_ANDROID
        ? `<a class="btn-outline" id="calLink" href="${googleCalendarUrl()}" target="_blank" rel="noopener">הוספה ליומן</a>`
        : `<button type="button" class="btn-outline" id="icsBtn">הוספה ליומן</button>`}
      ${token ? `<a class="btn-outline" id="manageLink" href="booking.html#${encodeURIComponent(token)}">ניהול ההזמנה</a>` : ''}
    `;
    if (!pending && !IS_ANDROID) document.getElementById('icsBtn').addEventListener('click', downloadIcs);
    prepareCard();
  } else if (result === 'bar_available') {
    found = false; offerBar = true; warning = null;
    renderBooking();
  } else if (result === 'full' || result === 'closed') {
    found = false;
    warning = result === 'full' ? 'התאריך הזה התמלא בדיוק עכשיו. נסו תאריך אחר.' : 'ההזמנות המקוונות לתאריך הזה נסגרו.';
    formData.date = null;
    renderBooking();
  } else {
    errEl.textContent = {
      invalid: 'אחד הפרטים לא תקין. בדקו את הפרטים ונסו שוב.',
      duplicate: 'כבר יש הזמנה על מספר הטלפון הזה לערב הזה. אפשר לשנות אותה דרך הקישור האישי שלה.',
      too_many: 'נעשו כבר כמה הזמנות מהחיבור הזה בשעה האחרונה. נסו שוב מאוחר יותר.'
    }[result] || 'השעה שבחרתם כבר לא זמינה. לחצו על השעה למעלה ובחרו שעה מאוחרת יותר.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'שריינו לי שולחן';
  }
}

// WhatsApp confirmation as a picture (owner's choice, Nov 2026). A web page can't
// attach a file to a WhatsApp link or send from the bar's WhatsApp, so the button
// opens the phone's share sheet with the picture; the customer picks WhatsApp.
// Where sharing files isn't possible (most computers) the link sends the text as before.
// The card itself is drawn by drawBookingCard() in card.js (shared with booking.html).
function cardData() {
  return { business: BUSINESS_NAME, name: formData.name, guests: formData.guests, time: formData.time, bookingId: formData.bookingId,
    pending: formData.pending, date: formData.date, seating: formData.placed };
}
let cardFile = null, shareText = '';

// The customer's private booking link, and the bookings this phone remembers, so a
// customer who closed the page can find their booking again (shown at the top of the page).
const MY_BOOKINGS = 'izabar_my_bookings';
function bookingUrl(token) { return new URL('booking.html#' + encodeURIComponent(token), location.href).href; }
function myBookings() {
  try { return JSON.parse(localStorage.getItem(MY_BOOKINGS)) || []; } catch (e) { return []; }
}
function rememberBooking(b) {
  try {
    const list = [b, ...myBookings().filter(x => x.token !== b.token)].filter(x => x.date >= todayStr()).slice(0, 10);
    localStorage.setItem(MY_BOOKINGS, JSON.stringify(list));
  } catch (e) { /* private browsing: nothing is remembered */ }
}
async function prepareCard() {
  cardFile = null;
  try { await document.fonts.load('900 100px Heebo'); } catch (e) {}
  const canvas = document.createElement('canvas');
  const preview = document.getElementById('cardPreview'), fallback = document.getElementById('cardFallback');
  // the card is the confirmation; the plain text shows only if the picture can't be made
  try {
    drawBookingCard(canvas, cardData());
    preview.src = canvas.toDataURL('image/png'); preview.hidden = false; fallback.remove();
  } catch (e) { fallback.hidden = false; return; }
  const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], 'izabar-booking.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) cardFile = file;
  // WhatsApp sometimes drops the picture's caption, and with it the link (owner's phone, Nov 2026):
  // where the picture is shared, a second button sends the link as a plain text message
  if (cardFile) { const t = document.getElementById('waLinkText'); if (t) t.hidden = false; }
  const wa = document.getElementById('waLink');
  if (wa) wa.addEventListener('click', e => {
    if (!cardFile) return;                      // no file sharing here: the link sends the text instead
    e.preventDefault();
    // the link goes along as the picture's caption (Android's WhatsApp keeps it; some iPhones drop it,
    // which is why the phone also remembers its bookings: see rememberBooking)
    navigator.share({ files: [cardFile], text: shareText }).catch(() => {});   // closing the share sheet is not an error
  });
}

// "Add to calendar". Android's Chrome can't open a calendar file straight into
// the calendar (it only downloads it), so Android opens Google Calendar with the
// booking filled in; iPhone and computers get the file, which they open directly.
const IS_ANDROID = /Android/i.test(navigator.userAgent);
const VISIT_HOURS = 2;
function visitTimes() {
  const [h, m] = formData.time.split(':').map(Number);
  const day = formData.date.replace(/-/g, '');
  const at = (hh, mm) => `${day}T${pad2(hh)}${pad2(mm)}00`;
  return { start: at(h, m), end: at(h + VISIT_HOURS, m) };   // arrivals end at 21:00, so this stays on the same day
}
function calendarTitle() { return `${BUSINESS_NAME} - ${placeText(formData.placed, formData.guests)}`; }
function googleCalendarUrl() {
  const t = visitTimes();
  const q = new URLSearchParams({ action: 'TEMPLATE', text: calendarTitle(), dates: `${t.start}/${t.end}`,
    ctz: 'Asia/Jerusalem', location: BUSINESS_NAME, details: `הזמנה על שם ${formData.name}` });
  return 'https://calendar.google.com/calendar/render?' + q.toString();
}
// Israel local date and time 'YYYYMMDDTHHMMSS' -> UTC 'YYYYMMDDTHHMMSSZ' (calendar files need an exact moment)
function israelToUtc(local) {
  const n = local.match(/\d+/g).join('');
  const [y, mo, d, h, mi] = [n.slice(0,4), n.slice(4,6), n.slice(6,8), n.slice(8,10), n.slice(10,12)].map(Number);
  const guess = Date.UTC(y, mo - 1, d, h, mi);
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jerusalem', year: 'numeric', month: '2-digit',
    day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date(guess)).map(x => [x.type, x.value]));
  const offset = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute) - guess;
  return new Date(guess - offset).toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
}
function buildIcs() {
  const t = visitTimes();
  const clean = v => String(v).replace(/[\;,]/g, m => '\\' + m).replace(/[\r\n]+/g, ' ');
  return [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Iza Bar//Reservations//HE', 'BEGIN:VEVENT',
    `UID:${formData.date}-${formData.time.replace(':', '')}-${Date.now()}@izabar`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,
    `DTSTART:${israelToUtc(t.start)}`, `DTEND:${israelToUtc(t.end)}`,
    `SUMMARY:${clean(calendarTitle())}`, `LOCATION:${clean(BUSINESS_NAME)}`,
    `DESCRIPTION:${clean('הזמנה על שם ' + formData.name)}`,
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
}
function downloadIcs() {
  const blob = new Blob([buildIcs()], { type: 'text/calendar' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'reservation.ics';
  link.click();
}

init();
</script>
