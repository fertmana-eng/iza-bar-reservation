<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הזמנת שולחן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f0e8d0;
    --paper-muted: rgba(240,232,208,0.62);
    --ink: #1c1610;
    --ink-soft: #5a4f3c;
    --line: rgba(28,22,16,0.28);
    --muted: rgba(28,22,16,0.55);
    --field-bg: rgba(28,22,16,0.05);
    --field-border: rgba(28,22,16,0.24);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Heebo', -apple-system, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  .header-band {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--ink);
    padding: 18px 20px 15px;
    text-align: center;
  }
  .page { max-width: 400px; width: 100%; margin: 0 auto; padding: 28px 20px 64px; }

  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 10px;
  }
  .venue-name {
    font-family: 'Heebo', sans-serif;
    font-weight: 900;
    font-size: 26px;
    color: var(--paper);
    margin: 0;
  }
  .slash-big {
    font-weight: 900;
    font-size: 26px;
    color: var(--paper);
  }
  .venue-tag {
    color: var(--paper-muted);
    font-weight: 700;
    font-size: 13px;
    white-space: nowrap;
  }

  .progress {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    gap: 10px;
    margin: 16px 0 32px;
    font-size: 11.5px;
  }
  .progress:empty { margin: 0; }
  .step-chip { color: var(--muted); }
  .step-chip.current { color: var(--ink); font-weight: 900; font-size: 17px; }
  button.step-chip.done {
    all: unset;
    color: var(--ink-soft);
    font-size: inherit;
    font-family: inherit;
    cursor: pointer;
    border-bottom: 1px dashed var(--ink-soft);
    padding-bottom: 1px;
  }
  .step-sep { color: var(--field-border); font-size: 10px; margin: 0 -3px; }

  .summary-chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 18px; align-items: baseline; }
  .chip-btn {
    all: unset;
    color: var(--ink-soft);
    font-size: 13px;
    border-bottom: 1px dashed var(--ink-soft);
    cursor: pointer;
    padding-bottom: 1px;
  }
  .chip-sep { color: var(--muted); font-size: 12px; }
  .summary-box {
    border-top: 1px dashed var(--line);
    border-bottom: 1px dashed var(--line);
    padding: 14px 0;
    margin: 18px 0 26px;
  }
  .summary-row {
    all: unset;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    width: 100%;
    padding: 6px 0;
    font-size: 14px;
    cursor: pointer;
    color: var(--ink);
    font-family: 'Heebo', sans-serif;
  }
  .summary-label { color: var(--ink-soft); }
  .summary-value { font-weight: 600; }

  .intro-copy { margin: 20px 0 26px; }
  .intro-copy p {
    font-size: 15.5px;
    line-height: 1.65;
    text-align: center;
    color: var(--ink);
    margin: 0 0 14px;
  }
  .intro-copy p:last-child { margin-bottom: 0; }
  .intro-subtitle { color: var(--ink); font-size: 21px; font-weight: 700; margin: 2px 0 24px; }

  .step-label { font-weight: 700; font-size: 14px; color: var(--ink-soft); margin: 0 0 6px; }
  .step-question { font-size: 21px; font-weight: 700; margin: 0 0 24px; }

  label {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field { margin-bottom: 18px; }

  input, textarea {
    width: 100%;
    background: var(--field-bg);
    border: 1px solid var(--field-border);
    border-radius: 4px;
    padding: 13px 14px;
    font-size: 17px;
    font-family: inherit;
    color: var(--ink);
  }
  input::placeholder, textarea::placeholder { color: rgba(28,22,16,0.32); }
  input:focus, textarea:focus { outline: none; border-color: var(--ink); }
  textarea { resize: none; }

  button.primary {
    width: 100%;
    height: 46px;
    border-radius: 8px;
    font-size: 15.5px;
    font-weight: 600;
    font-family: 'Heebo', sans-serif;
    cursor: pointer;
    margin-top: 8px;
    border: none;
    background: var(--ink);
    color: var(--paper);
  }
  button.primary:disabled { opacity: 0.45; }
  .skip-link {
    display: block;
    text-align: center;
    background: none; border: none;
    color: var(--ink-soft); font-size: 14px; font-family: inherit;
    margin-top: 14px; cursor: pointer;
  }

  /* Calendar */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-month { font-weight: 700; font-size: 17px; }
  .cal-nav { background: none; border: none; color: var(--ink); font-size: 20px; padding: 4px 10px; cursor: pointer; }
  .cal-nav:disabled { color: var(--field-border); cursor: default; }
  .cal-weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-weekdays div { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding-bottom: 8px; }
  .cal-grid button {
    all: unset; box-sizing: border-box; width: 100%; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--ink); border-radius: 50%; cursor: pointer;
  }
  .cal-grid button:disabled { color: rgba(28,22,16,0.22); cursor: default; }
  .cal-grid button.today { border: 1px solid var(--ink-soft); }
  .cal-grid button.selected { background: var(--ink); color: var(--paper); font-weight: 700; }

  .warning { color: #8a3f22; font-size: 14px; margin-top: 16px; text-align: center; }

  /* Time picker */
  .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .time-grid button {
    all: unset; box-sizing: border-box; text-align: center; padding: 13px 0;
    border: 1px solid var(--field-border); border-radius: 4px;
    font-size: 15px; color: var(--ink); cursor: pointer;
  }
  .time-grid button.selected { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* Guests stepper */
  .stepper { display: flex; align-items: center; justify-content: center; gap: 24px; margin-bottom: 10px; }
  .stepper button {
    all: unset; width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid var(--field-border); display: flex; align-items: center; justify-content: center;
    font-size: 22px; cursor: pointer;
  }
  .stepper-value { font-size: 32px; font-weight: 700; min-width: 50px; text-align: center; }
  .stepper button:disabled { opacity: 0.3; cursor: default; }
  .hint { text-align: center; font-size: 12px; color: var(--muted); margin: 0 0 6px; }

  .error { color: #8a3f22; font-size: 13px; margin-top: 8px; }

  .full-msg { text-align: center; padding: 4px 0; }
  .full-msg p:first-child { font-size: 17px; margin-bottom: 8px; }
  .full-msg p:last-child { color: var(--muted); font-size: 14px; }

  .success { text-align: center; padding: 8px 0 28px; }
  .success h2 { font-family: 'Heebo', sans-serif; font-weight: 900; font-size: 24px; margin: 0 0 10px; }
  .success p { font-size: 15px; margin: 4px 0; }
  .card-fallback[hidden] { display: none; }
  .btn-outline {
    width: 100%; height: 48px; border-radius: 4px; font-size: 15px; font-weight: 600;
    font-family: 'Heebo', sans-serif; cursor: pointer; margin-top: 10px;
    background: transparent; color: var(--ink); border: 1px solid var(--field-border);
  }
  a.btn-outline, a.btn-whatsapp { display: flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box; }
  .card-preview { display: block; width: min(320px, 86%); margin: 0 auto; border-radius: 6px; box-shadow: 0 6px 24px rgba(28,22,16,.18); }
  .card-preview[hidden] { display: none; }
  .my-bookings { border: 1px solid var(--field-border); border-radius: 8px; padding: 12px 14px 6px; margin: 0 0 24px; }
  .my-title { font-weight: 700; font-size: 14px; color: var(--ink-soft); margin: 0 0 6px; }
  .my-booking { display: flex; justify-content: space-between; align-items: center; min-height: 44px; color: var(--ink);
    text-decoration: none; font-weight: 600; font-size: 15px; border-top: 1px dashed var(--line); }
  .my-booking:first-of-type { border-top: none; }
  .my-booking span { color: var(--ink-soft); font-weight: 400; font-size: 13px; }
  .btn-whatsapp {
    width: 100%; height: 48px; border-radius: 4px; font-size: 15px; font-weight: 700;
    font-family: 'Heebo', sans-serif; cursor: pointer; margin-top: 4px;
    background: #2fae60; color: #fff; border: none;
  }
</style>
</head>
<body>
<div class="header-band">
  <div class="title-row">
    <h1 class="venue-name" id="venueName">עיזה בר</h1>
    <span class="slash-big">//</span>
    <span class="venue-tag">הזמנת מקומות</span>
  </div>
</div>
<div class="page" id="page">
  <div class="progress" id="progress"></div>
  <div id="stepArea"><p style="text-align:center; color:var(--muted);">טוען...</p></div>
</div>

<!-- ================= CONFIGURATION ================= -->
<script>
  const SUPABASE_URL = "https://brpovhypzsgwsnuenpfj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_FG6kYV7D4D7iDXYYHGrysw_bJ-ag_0e";
  const BUSINESS_NAME = "עיזה בר";
</script>
<!-- =================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="card.js"></script>
<script>
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

document.getElementById('venueName').textContent = BUSINESS_NAME;

const stepArea = document.getElementById('stepArea');
const progressEl = document.getElementById('progress');
const BOOKING_WINDOW_DAYS = 30;
const WEEKDAY_LETTERS = ['א','ב','ג','ד','ה','ו','ש'];
const STEPS = ['date', 'guests', 'time', 'details', 'extra'];
const STEP_LABELS = { date: 'תאריך', guests: 'סועדים', time: 'שעה', details: 'פרטים', extra: 'סיום' };

let stepIndex = 0;
let pageSettings = null;
let viewMonth, minDate, maxDate;
let dateWarning = null;
let guestsWarning = null;

const formData = { date: null, time: null, name: '', phone: '', guests: 2, note: '', bookingId: null, pending: false };

// All dates and times are the restaurant's (Israel), whatever the phone's
// time zone. Calendar days are kept as 'YYYY-MM-DD' text built from the day's
// own numbers (never toISOString, which shifts to UTC and moved every day back).
// The same phone rule the database checks (supabase/migrations/08_booking_limits.sql)
const PHONE_OK = /^[0-9+() -]{7,20}$/;

function israelNow() {
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Jerusalem', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
  }).formatToParts(new Date()).map(p => [p.type, p.value]));
  return { date: `${parts.year}-${parts.month}-${parts.day}`, time: `${parts.hour}:${parts.minute}` };
}
// Customer text is shown inside HTML: turn < > & " ' into harmless characters first,
// so a name or note can never become code on the page.
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function todayStr() { return israelNow().date; }
function pad2(n) { return String(n).padStart(2, '0'); }
function toDateStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function fromDateStr(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function formatDisplay(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric' });
}
function timeOptions(start, end) {
  const opts = [];
  let [h, m] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  while (h < eh || (h === eh && m <= em)) {
    opts.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
    m += 15;
    if (m >= 60) { m = 0; h += 1; }
  }
  return opts;
}

async function getSettings() {
  const { data: settingsRows } = await db.from('settings')
    .select('key,value').in('key', ['arrival_start','arrival_end','booking_cutoff']);
  const settings = Object.fromEntries((settingsRows || []).map(r => [r.key, r.value]));
  return {
    start: settings.arrival_start || '17:00',
    end: settings.arrival_end || '21:00',
    cutoff: settings.booking_cutoff || '20:00'
  };
}

function stepValueText(s) {
  if (s === 'date' && formData.date) return formatDisplay(formData.date);
  if (s === 'time' && formData.time) return formData.time;
  if (s === 'guests') return formData.guests + ' סועדים';
  if (s === 'details' && formData.name) return formData.name;
  return null;
}

function renderProgress() {
  progressEl.innerHTML = STEPS.map((s, i) => {
    const state = i < stepIndex ? 'done' : i === stepIndex ? 'current' : 'upcoming';
    const value = state === 'done' ? stepValueText(s) : null;
    const label = value || STEP_LABELS[s];
    return state === 'done'
      ? `<button type="button" class="step-chip done" data-step="${i}">${esc(label)}</button>`
      : `<span class="step-chip ${state}">${esc(label)}</span>`;
  }).join('<span class="step-sep">›</span>');

  progressEl.querySelectorAll('.step-chip.done').forEach(btn => {
    btn.addEventListener('click', () => goToStep(parseInt(btn.getAttribute('data-step'), 10)));
  });
}

function goNext() {
  if (stepIndex < STEPS.length - 1) { stepIndex++; renderStep(); }
}
function goToStep(i) {
  stepIndex = i; renderStep();
}

function summaryParts() {
  const parts = [];
  for (let i = 0; i < stepIndex; i++) {
    const s = STEPS[i];
    if (s === 'date' && formData.date) parts.push({ text: formatDisplay(formData.date), step: i });
    else if (s === 'time' && formData.time) parts.push({ text: formData.time, step: i });
    else if (s === 'details') {
      if (formData.name) parts.push({ text: formData.name, step: i });
      if (formData.phone) parts.push({ text: formData.phone, step: i });
    }
    else if (s === 'guests') parts.push({ text: formData.guests + ' סועדים', step: i });
  }
  return parts;
}
function summaryHtml() {
  const parts = summaryParts();
  if (!parts.length) return '';
  return `<div class="summary-chips">${parts.map((p, idx) =>
    `<button type="button" class="chip-btn" data-step="${p.step}">${esc(p.text)}</button>${idx < parts.length - 1 ? '<span class="chip-sep">·</span>' : ''}`
  ).join('')}</div>`;
}
function bindSummaryClicks() {
  stepArea.querySelectorAll('.chip-btn').forEach(btn => {
    btn.addEventListener('click', () => goToStep(parseInt(btn.getAttribute('data-step'), 10)));
  });
}

async function init() {
  pageSettings = await getSettings();

  const now = israelNow();
  const minD = fromDateStr(now.date);
  const maxD = new Date(minD); maxD.setDate(maxD.getDate() + BOOKING_WINDOW_DAYS);
  minDate = minD; maxDate = maxD;

  const initial = fromDateStr(now.date);
  if (now.time > pageSettings.cutoff) initial.setDate(initial.getDate() + 1);
  viewMonth = new Date(initial.getFullYear(), initial.getMonth(), 1);

  renderIntro();
}

function renderIntro() {
  progressEl.innerHTML = '';
  const mine = myBookings().filter(b => b.date >= todayStr()).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  stepArea.innerHTML = `
    ${mine.length ? `<div class="my-bookings" id="myBookings">
      <p class="my-title">ההזמנות שלי</p>
      ${mine.map(b => `<a class="my-booking" href="booking.html#${encodeURIComponent(b.token)}">${formatDisplay(b.date)} · ${esc(b.time)} · ${Number(b.guests)} סועדים<span>לצפייה ושינוי ‹</span></a>`).join('')}
    </div>` : ''}
    <p class="step-question" style="margin-bottom:4px;">איזה כיף שחשבתם עלינו 🙌</p>
    <p class="intro-subtitle">רק כמה דברים לפני שמתחילים...</p>
    <div class="intro-copy">
      <p>הזמנת מקומות אצלנו בפנים בלבד, בין השעות <span dir="ltr" style="white-space:nowrap;">17:00–21:00</span>.</p>
      <p>הישיבה בחוץ היא על בסיס מקום פנוי - אין אופציה להזמין מראש, פשוט מגיעים וממתינים שיתפנה שולחן 🙂</p>
      <p>הזמנות לאותו היום: עד 16:00 ההזמנה מאושרת מיד. בין 16:00 ל-20:00 נאשר אותה מולכם בוואטסאפ. אחרי 20:00 כבר לא ניתן להזמין להיום.</p>
      <p>נוכל לחכות למאחרים עד 15 דקות משעת ההזמנה - לאחר מכן לא נוכל להתחייב שהמקום ישמר לכם, עמכם הסליחה 🙏</p>
      <p>קחו בבקשה בחשבון שבמידה והקדמתם, ייתכן שתצטרכו להמתין שהמקום שלכם יתפנה.</p>
    </div>
    <button type="button" class="primary" id="introNext">יאללה בואו נתחיל</button>
  `;
  document.getElementById('introNext').addEventListener('click', () => {
    stepIndex = 0;
    renderStep();
  });
}

function renderStep() {
  renderProgress();
  const step = STEPS[stepIndex];
  if (step === 'date') renderDateStep();
  else if (step === 'time') renderTimeStep();
  else if (step === 'details') renderDetailsStep();
  else if (step === 'guests') renderGuestsStep();
  else if (step === 'extra') renderExtraStep();
}

function renderDateStep() {
  const monthLabel = viewMonth.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' });
  const firstOfMonth = new Date(viewMonth);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0).getDate();
  const prevMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1);
  const nextMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1);
  const prevDisabled = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 0) < minDate;
  const nextDisabled = nextMonth > maxDate;

  let cells = '';
  for (let i = 0; i < startWeekday; i++) cells += '<div></div>';
  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), day);
    const dStr = toDateStr(d);
    const disabled = d < minDate || d > maxDate;
    const classes = [];
    if (dStr === todayStr()) classes.push('today');
    if (dStr === formData.date) classes.push('selected');
    cells += `<button type="button" class="${classes.join(' ')}" data-date="${dStr}" ${disabled ? 'disabled' : ''}>${day}</button>`;
  }

  stepArea.innerHTML = `
    <p class="step-question">מתי מגיעים?</p>
    <div class="cal-head">
      <button type="button" class="cal-nav" id="prevMonth" ${prevDisabled ? 'disabled' : ''}>‹</button>
      <span class="cal-month">${monthLabel}</span>
      <button type="button" class="cal-nav" id="nextMonth" ${nextDisabled ? 'disabled' : ''}>›</button>
    </div>
    <div class="cal-weekdays">${WEEKDAY_LETTERS.map(l => `<div>${l}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    ${dateWarning ? `<p class="warning">${dateWarning}</p>` : ''}
    <button type="button" class="primary" id="dateNext" ${formData.date ? '' : 'disabled'}>לבחירת כמות סועדים</button>
  `;

  document.getElementById('prevMonth').addEventListener('click', () => { viewMonth = prevMonth; renderDateStep(); });
  document.getElementById('nextMonth').addEventListener('click', () => { viewMonth = nextMonth; renderDateStep(); });
  stepArea.querySelectorAll('.cal-grid button:not(:disabled)').forEach(btn => {
    btn.addEventListener('click', () => {
      dateWarning = null;
      formData.date = btn.getAttribute('data-date');
      renderDateStep();
    });
  });
  document.getElementById('dateNext').addEventListener('click', checkDateAndContinue);
}

async function checkDateAndContinue() {
  const dStr = formData.date;
  const btn = document.getElementById('dateNext');
  btn.disabled = true;
  btn.textContent = 'בודק זמינות...';

  const now = israelNow();
  if (dStr === now.date) {
    if (now.time > pageSettings.cutoff) {
      dateWarning = 'ההזמנות המקוונות ליום זה נסגרו. נסו תאריך אחר.';
      formData.date = null;
      renderDateStep();
      return;
    }
  }
  const { data: spotsData } = await db.rpc('available_spots', { p_date: dStr });
  const spots = typeof spotsData === 'number' ? spotsData : 0;
  if (spots <= 0) {
    dateWarning = 'אין מקומות פנויים בתאריך הזה. נסו תאריך אחר.';
    formData.date = null;
    renderDateStep();
    return;
  }
  guestsWarning = null;
  goNext();
}

function timeToMinutes(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}
function minutesToTime(mins) {
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

// Same-day arrivals start at least 30 minutes from now, rounded up to the next quarter hour.
function earliestArrival() {
  const now = israelNow();
  let min = timeToMinutes(pageSettings.start);
  if (formData.date === now.date) min = Math.max(min, Math.ceil((timeToMinutes(now.time) + 30) / 15) * 15);
  return min;
}
function renderTimeStep() {
  const minMin = earliestArrival();
  if (!formData.time || timeToMinutes(formData.time) < minMin) formData.time = minutesToTime(minMin);
  const maxMin = timeToMinutes(pageSettings.end);
  const curMin = timeToMinutes(formData.time);

  stepArea.innerHTML = `
    <p class="step-question">באיזו שעה תרצו להגיע?</p>
    <div class="stepper">
      <button type="button" id="timeMinus" ${curMin <= minMin ? 'disabled' : ''}>−</button>
      <span class="stepper-value" id="timeValue">${formData.time}</span>
      <button type="button" id="timePlus" ${curMin >= maxMin ? 'disabled' : ''}>+</button>
    </div>
    <p class="hint">בין ${minutesToTime(minMin)} ל-${pageSettings.end}</p>
    <button type="button" class="primary" id="timeNext">לפרטים האישיים</button>
  `;
  document.getElementById('timeMinus').addEventListener('click', () => {
    const m = timeToMinutes(formData.time);
    if (m > minMin) { formData.time = minutesToTime(m - 15); renderTimeStep(); }
  });
  document.getElementById('timePlus').addEventListener('click', () => {
    const m = timeToMinutes(formData.time);
    if (m < maxMin) { formData.time = minutesToTime(m + 15); renderTimeStep(); }
  });
  document.getElementById('timeNext').addEventListener('click', goNext);
}

function renderDetailsStep() {
  stepArea.innerHTML = `
    <p class="step-question">על איזה שם ומספר טלפון ההזמנה?</p>
    <form id="detailsForm">
      <div class="field">
        <label for="nameInput">שם</label>
        <input id="nameInput" type="text" placeholder="שם פרטי ושם משפחה" maxlength="80" value="${esc(formData.name)}" required autofocus>
      </div>
      <div class="field">
        <label for="phoneInput">טלפון</label>
        <input id="phoneInput" type="tel" placeholder="050-0000000" maxlength="20" value="${esc(formData.phone)}" required>
      </div>
      <div id="detailsError" class="error" style="display:none;"></div>
      <button type="submit" class="primary">לסיכום ההזמנה</button>
    </form>
  `;
  document.getElementById('detailsForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('nameInput').value.trim();
    const phone = document.getElementById('phoneInput').value.trim();
    const problem = !name || !phone ? 'נא למלא שם וטלפון.' : !PHONE_OK.test(phone) ? 'מספר הטלפון לא תקין.' : null;
    if (problem) {
      const err = document.getElementById('detailsError');
      err.textContent = problem;
      err.style.display = 'block';
      return;
    }
    formData.name = name;
    formData.phone = phone;
    goNext();
  });
}

function renderGuestsStep() {
  stepArea.innerHTML = `
    <p class="step-question">כמה תהיו?</p>
    <div class="stepper">
      <button type="button" id="guestsMinus" ${formData.guests <= 1 ? 'disabled' : ''}>−</button>
      <span class="stepper-value" id="guestsValue">${formData.guests}</span>
      <button type="button" id="guestsPlus" ${formData.guests >= 10 ? 'disabled' : ''}>+</button>
    </div>
    <p class="hint">עד 10 סועדים</p>
    <button type="button" class="primary" id="guestsNext">לבחירת שעה</button>
    ${guestsWarning ? `<p class="warning">${guestsWarning}</p>` : ''}
  `;
  const valueEl = document.getElementById('guestsValue');
  document.getElementById('guestsMinus').addEventListener('click', () => {
    if (formData.guests > 1) { formData.guests--; renderGuestsStep(); }
  });
  document.getElementById('guestsPlus').addEventListener('click', () => {
    if (formData.guests < 10) { formData.guests++; renderGuestsStep(); }
  });
  document.getElementById('guestsNext').addEventListener('click', checkGuestsAndContinue);
}

async function checkGuestsAndContinue() {
  guestsWarning = null;
  const btn = document.getElementById('guestsNext');
  btn.disabled = true;
  btn.textContent = 'בודק זמינות...';

  const { data, error } = await db.rpc('check_availability', { p_date: formData.date, p_guests: formData.guests });

  if (error) {
    console.error('Availability check error:', error);
    guestsWarning = 'שגיאה בבדיקת זמינות, נסו שוב.';
    renderGuestsStep();
    return;
  }

  if (!data) {
    guestsWarning = 'אין מקום מתאים לקבוצה בגודל הזה בתאריך שבחרתם. נסו תאריך אחר או קבוצה קטנה יותר.';
    renderGuestsStep();
    return;
  }

  goNext();
}

function fullSummaryHtml() {
  const rows = [
    ['תאריך', formatDisplay(formData.date), STEPS.indexOf('date')],
    ['שעה', formData.time, STEPS.indexOf('time')],
    ['סועדים', formData.guests, STEPS.indexOf('guests')],
    ['שם', formData.name, STEPS.indexOf('details')],
    ['טלפון', formData.phone, STEPS.indexOf('details')]
  ];
  return `<div class="summary-box">${rows.map(([label, value, step]) =>
    `<button type="button" class="summary-row" data-step="${step}"><span class="summary-label">${label}</span><span class="summary-value">${esc(value)}</span></button>`
  ).join('')}</div>`;
}
function bindFullSummaryClicks() {
  stepArea.querySelectorAll('.summary-row').forEach(btn => {
    btn.addEventListener('click', () => goToStep(parseInt(btn.getAttribute('data-step'), 10)));
  });
}

function renderExtraStep() {
  stepArea.innerHTML = `
    <p class="step-question">פרטי ההזמנה</p>
    ${fullSummaryHtml()}
    <div class="field">
      <label for="noteInput">הערה (לא חובה)</label>
      <textarea id="noteInput" rows="2" maxlength="300" placeholder="לדוגמה: יום הולדת, כיסא תינוק...">${esc(formData.note)}</textarea>
    </div>
    <div id="submitError" class="error" style="display:none;"></div>
    <button type="button" class="primary" id="submitBtn">שריינו לי שולחן</button>
  `;
  bindFullSummaryClicks();
  document.getElementById('submitBtn').addEventListener('click', submitBooking);
}

async function submitBooking() {
  formData.note = document.getElementById('noteInput').value.trim();

  const btn = document.getElementById('submitBtn');
  const errEl = document.getElementById('submitError');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'שולח...';

  const { data, error } = await db.rpc('book_reservation', {
    p_date: formData.date,
    p_time: formData.time,
    p_name: formData.name,
    p_phone: formData.phone,
    p_guests: formData.guests,
    p_note: formData.note || null
  });

  if (error || !data || !data[0]) {
    console.error('Booking error:', error);
    errEl.textContent = 'שגיאה: ' + (error ? (error.message || JSON.stringify(error)) : 'תשובה ריקה מהשרת');
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'שריינו לי שולחן';
    return;
  }

  const result = data[0].result;

  if (result === 'confirmed' || result === 'pending') {
    // 'pending': a same-day request made between 16:00 and 20:00, held until the manager approves it
    const pending = result === 'pending';
    formData.bookingId = data[0].reservation_id;
    formData.pending = pending;
    const token = data[0].booking_token;     // the customer's private link (booking.html#<token>)
    const title = pending ? 'הבקשה התקבלה' : 'ההזמנה אושרה';
    if (token) rememberBooking({ token, date: formData.date, time: formData.time, guests: formData.guests });
    shareText = `${pending ? 'בקשת הזמנה (ממתינה לאישור)' : 'אישור הזמנה'} - ${BUSINESS_NAME}\n${formData.name}, שולחן ל-${formData.guests} סועדים\n${formatDisplay(formData.date)} בשעה ${formData.time}`
      + (token ? `\nלצפייה, שינוי או ביטול: ${bookingUrl(token)}` : '');
    const waText = encodeURIComponent(shareText);
    progressEl.innerHTML = '';
    stepArea.innerHTML = `
      <div class="success">
        <img class="card-preview" id="cardPreview" hidden
          alt="${title}${pending ? ' וממתינה לאישור' : ''}: ${esc(formData.name)}, שולחן ל-${formData.guests} סועדים, ${formatDisplay(formData.date)} בשעה ${formData.time}">
        <div class="card-fallback" id="cardFallback" hidden>
          <h2>${title}</h2>
          ${pending ? '<p>ממתינה לאישור. נעדכן אתכם בוואטסאפ.</p>' : ''}
          <p>${esc(formData.name)}, שולחן ל-${formData.guests} סועדים</p>
          <p>${formatDisplay(formData.date)} בשעה ${formData.time}</p>
        </div>
      </div>
      <a class="btn-whatsapp" id="waLink" href="https://wa.me/?text=${waText}" target="_blank" rel="noopener">שליחה לוואטסאפ שלי</a>
      ${pending ? '' : IS_ANDROID
        ? `<a class="btn-outline" id="calLink" href="${googleCalendarUrl()}" target="_blank" rel="noopener">הוספה ליומן</a>`
        : `<button type="button" class="btn-outline" id="icsBtn">הוספה ליומן</button>`}
      ${token ? `<a class="btn-outline" id="manageLink" href="booking.html#${encodeURIComponent(token)}">ניהול ההזמנה</a>` : ''}
    `;
    if (!pending && !IS_ANDROID) document.getElementById('icsBtn').addEventListener('click', downloadIcs);
    prepareCard();
  } else if (result === 'full') {
    stepIndex = 0;
    dateWarning = 'התאריך הזה התמלא בדיוק עכשיו. נסו תאריך אחר.';
    formData.date = null;
    renderStep();
  } else if (result === 'closed') {
    stepIndex = 0;
    dateWarning = 'ההזמנות המקוונות לתאריך הזה נסגרו.';
    formData.date = null;
    renderStep();
  } else {
    errEl.textContent = result === 'invalid' ? 'אחד הפרטים לא תקין. בדקו את הפרטים ונסו שוב.'
      : 'השעה שבחרתם כבר לא זמינה. לחצו על השעה למעלה ובחרו שעה מאוחרת יותר.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'שריינו לי שולחן';
  }
}

// WhatsApp confirmation as a picture (owner's choice, Nov 2026). A web page can't
// attach a file to a WhatsApp link or send from the bar's WhatsApp, so the button
// opens the phone's share sheet with the picture; the customer picks WhatsApp.
// Where sharing files isn't possible (most computers) the link sends the text as before.
// The card itself is drawn by drawBookingCard() in card.js (shared with booking.html).
function cardData() {
  return { business: BUSINESS_NAME, name: formData.name, guests: formData.guests, time: formData.time, bookingId: formData.bookingId,
    pending: formData.pending, date: formData.date };
}
let cardFile = null, shareText = '';

// The customer's private booking link, and the bookings this phone remembers, so a
// customer who closed the page can find their booking again (shown on the welcome screen).
const MY_BOOKINGS = 'izabar_my_bookings';
function bookingUrl(token) { return new URL('booking.html#' + encodeURIComponent(token), location.href).href; }
function myBookings() {
  try { return JSON.parse(localStorage.getItem(MY_BOOKINGS)) || []; } catch (e) { return []; }
}
function rememberBooking(b) {
  try {
    const list = [b, ...myBookings().filter(x => x.token !== b.token)].filter(x => x.date >= todayStr()).slice(0, 10);
    localStorage.setItem(MY_BOOKINGS, JSON.stringify(list));
  } catch (e) { /* private browsing: nothing is remembered */ }
}
async function prepareCard() {
  cardFile = null;
  try { await document.fonts.load('900 100px Heebo'); } catch (e) {}
  const canvas = document.createElement('canvas');
  const preview = document.getElementById('cardPreview'), fallback = document.getElementById('cardFallback');
  // the card is the confirmation; the plain text shows only if the picture can't be made
  try {
    drawBookingCard(canvas, cardData());
    preview.src = canvas.toDataURL('image/png'); preview.hidden = false; fallback.remove();
  } catch (e) { fallback.hidden = false; return; }
  const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], 'izabar-booking.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) cardFile = file;
  const wa = document.getElementById('waLink');
  if (wa) wa.addEventListener('click', e => {
    if (!cardFile) return;                      // no file sharing here: the link sends the text instead
    e.preventDefault();
    // the link goes along as the picture's caption (Android's WhatsApp keeps it; some iPhones drop it,
    // which is why the phone also remembers its bookings: see rememberBooking)
    navigator.share({ files: [cardFile], text: shareText }).catch(() => {});   // closing the share sheet is not an error
  });
}

// "Add to calendar". Android's Chrome can't open a calendar file straight into
// the calendar (it only downloads it), so Android opens Google Calendar with the
// booking filled in; iPhone and computers get the file, which they open directly.
const IS_ANDROID = /Android/i.test(navigator.userAgent);
const VISIT_HOURS = 2;
function visitTimes() {
  const [h, m] = formData.time.split(':').map(Number);
  const day = formData.date.replace(/-/g, '');
  const at = (hh, mm) => `${day}T${pad2(hh)}${pad2(mm)}00`;
  return { start: at(h, m), end: at(h + VISIT_HOURS, m) };   // arrivals end at 21:00, so this stays on the same day
}
function calendarTitle() { return `${BUSINESS_NAME} - שולחן ל-${formData.guests}`; }
function googleCalendarUrl() {
  const t = visitTimes();
  const q = new URLSearchParams({ action: 'TEMPLATE', text: calendarTitle(), dates: `${t.start}/${t.end}`,
    ctz: 'Asia/Jerusalem', location: BUSINESS_NAME, details: `הזמנה על שם ${formData.name}` });
  return 'https://calendar.google.com/calendar/render?' + q.toString();
}
// Israel local date and time 'YYYYMMDDTHHMMSS' -> UTC 'YYYYMMDDTHHMMSSZ' (calendar files need an exact moment)
function israelToUtc(local) {
  const n = local.match(/\d+/g).join('');
  const [y, mo, d, h, mi] = [n.slice(0,4), n.slice(4,6), n.slice(6,8), n.slice(8,10), n.slice(10,12)].map(Number);
  const guess = Date.UTC(y, mo - 1, d, h, mi);
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jerusalem', year: 'numeric', month: '2-digit',
    day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date(guess)).map(x => [x.type, x.value]));
  const offset = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute) - guess;
  return new Date(guess - offset).toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
}
function buildIcs() {
  const t = visitTimes();
  const clean = v => String(v).replace(/[\;,]/g, m => '\\' + m).replace(/[\r\n]+/g, ' ');
  return [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Iza Bar//Reservations//HE', 'BEGIN:VEVENT',
    `UID:${formData.date}-${formData.time.replace(':', '')}-${Date.now()}@izabar`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,
    `DTSTART:${israelToUtc(t.start)}`, `DTEND:${israelToUtc(t.end)}`,
    `SUMMARY:${clean(calendarTitle())}`, `LOCATION:${clean(BUSINESS_NAME)}`,
    `DESCRIPTION:${clean('הזמנה על שם ' + formData.name)}`,
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
}
function downloadIcs() {
  const blob = new Blob([buildIcs()], { type: 'text/calendar' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'reservation.ics';
  link.click();
}

init();
</script>
