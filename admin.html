<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול הזמנות</title>
<style>
  :root {
    --ink: #1f1e1c;
    --muted: #6b6862;
    --bg: #f6f4ef;
    --card: #ffffff;
    --border: #e4e0d6;
    --accent: #2f4a3d;
    --accent-light: #eaf1ec;
    --danger: #7a2e2e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 20px 14px 60px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
  }
  input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 15px;
    margin-bottom: 10px;
  }
  button {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    height: 44px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .error { color: var(--danger); font-size: 13px; margin-bottom: 10px; }
  .group-title {
    font-size: 13px;
    color: var(--muted);
    margin: 20px 0 8px;
    font-weight: 600;
  }
  .res-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    gap: 8px;
  }
  .res-row:last-child { border-bottom: none; }
  .res-time { font-weight: 600; min-width: 44px; }
  .res-name { flex: 1; padding: 0 6px; }
  .res-guests { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .res-note { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .summary { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .top-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .signout-link {
    all: unset;
    color: var(--muted);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
  }
  .error[hidden] { display: none; }
  .pending-title { color: #8a5a00; }
  .pending-card { border-color: #e2c27a; background: #fffaf0; }
  .pending-card .res-row { flex-wrap: wrap; }
  .pending-actions { flex-basis: 100%; display: flex; gap: 14px; align-items: center; margin-top: 8px; }
  .approve-btn {
    display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px;
    background: #2fae60; color: #fff; border-radius: 10px; font-weight: 600; font-size: 14px; text-decoration: none;
  }
  .decline-link { color: var(--danger); font-size: 13px; text-decoration: underline; padding: 10px 4px; }
  .res-change { flex-basis: 100%; font-size: 13px; color: #8a5a00; margin-top: 6px; font-weight: 600; }
  .changed-tag { font-size: 11px; color: #8a5a00; background: #f6e7c4; border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
  .cancelled-card { opacity: .6; }
  .cancelled-card .res-name { text-decoration: line-through; }
  .cancel-link {
    color: var(--danger);
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="wrap" id="app">טוען...</div>

<!-- ================= CONFIGURATION ================= -->
<script>
  const SUPABASE_URL = "https://brpovhypzsgwsnuenpfj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_FG6kYV7D4D7iDXYYHGrysw_bJ-ag_0e";
</script>
<!-- =================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');

// Customer text is shown inside HTML: turn < > & " ' into harmless characters first,
// so a name or note can never become code on the page.
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Today in Israel, whatever the phone's time zone (toISOString would give the UTC date).
function todayStr() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jerusalem', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}

function formatDisplay(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric', year: 'numeric' });
}

let currentDate = todayStr();

// Manager login: one username + password. Supabase logins need an email
// address, so the username becomes <username>@izabar.local (not a real inbox).
const LOGIN_DOMAIN = 'izabar.local';

async function start() {
  const { data } = await db.auth.getSession();
  if (data && data.session) renderShell(); else renderLogin();
}

function renderLogin() {
  app.innerHTML = `
    <h1>ניהול הזמנות</h1>
    <form class="card" id="loginForm">
      <input id="userInput" placeholder="שם משתמש" autocomplete="username" autocapitalize="off" spellcheck="false" dir="ltr">
      <input id="passInput" type="password" placeholder="סיסמה" autocomplete="current-password" dir="ltr">
      <div class="error" id="loginError" hidden></div>
      <button type="submit" id="loginBtn">כניסה</button>
    </form>
  `;
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const user = document.getElementById('userInput').value.trim().toLowerCase();
    const password = document.getElementById('passInput').value;
    const errEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    errEl.hidden = true;
    if (!user || !password) { errEl.textContent = 'נא למלא שם משתמש וסיסמה.'; errEl.hidden = false; return; }
    btn.disabled = true; btn.textContent = 'נכנס...';
    const { error } = await db.auth.signInWithPassword({ email: user + '@' + LOGIN_DOMAIN, password });
    if (error) {
      errEl.textContent = error.status === 400 ? 'שם משתמש או סיסמה שגויים.' : 'אין חיבור לשרת, נסו שוב.';
      errEl.hidden = false; btn.disabled = false; btn.textContent = 'כניסה';
      return;
    }
    renderShell();
  });
}

async function signOut() {
  await db.auth.signOut();
  renderLogin();
}

async function renderShell() {
  app.innerHTML = `
    <div class="top-bar"><button type="button" class="signout-link" id="signOutBtn">יציאה</button></div>
    <div class="field" style="margin-bottom:16px;">
      <input id="dateInput" type="date" value="${currentDate}">
    </div>
    <div id="listContent">טוען...</div>
  `;
  document.getElementById('signOutBtn').addEventListener('click', signOut);
  document.getElementById('dateInput').addEventListener('change', (e) => {
    currentDate = e.target.value;
    renderList();
  });
  renderList();
}

// Same-day requests made between 16:00 and 20:00 arrive as 'pending' and hold their table.
// Approving or declining saves the answer and opens WhatsApp to the customer with a
// ready message (the manager presses send): a page can't send WhatsApp messages itself.
const BUSINESS_NAME = 'עיזה בר';
function waNumber(phone) {
  const d = String(phone).replace(/\D/g, '');
  return d.startsWith('972') ? d : d.startsWith('0') ? '972' + d.slice(1) : d;
}
function bookingLink(r) {
  return r.access_token ? `\nלצפייה, שינוי או ביטול: ${new URL('booking.html#' + r.access_token, location.href).href}` : '';
}
// r.prev: the confirmed details kept while a change the customer made waits for approval
function waLink(r, approve) {
  const when = `${formatDisplay(r.reservation_date || currentDate)} בשעה ${r.arrival_time.slice(0, 5)}`;
  const p = r.prev, prevWhen = p ? `${formatDisplay(p.reservation_date)} בשעה ${String(p.arrival_time).slice(0, 5)}` : '';
  const text = p
    ? (approve
      ? `שלום ${r.customer_name}, השינוי בהזמנה שלך ל${BUSINESS_NAME} אושר ✳\n${when}, שולחן ל-${r.guests}.\nנחכה עד 15 דקות משעת ההזמנה. מחכים לך!` + bookingLink(r)
      : `שלום ${r.customer_name}, מצטערים, לא נוכל לאשר את השינוי בהזמנה שלך ל${BUSINESS_NAME}. ההזמנה המקורית שלך בתוקף: ${prevWhen}, שולחן ל-${p.guests}.` + bookingLink(r))
    : (approve
      ? `שלום ${r.customer_name}, ההזמנה שלך ל${BUSINESS_NAME} אושרה ✳\n${when}, שולחן ל-${r.guests}.\nנחכה עד 15 דקות משעת ההזמנה. מחכים לך!` + bookingLink(r)
      : `שלום ${r.customer_name}, תודה שפנית ל${BUSINESS_NAME}. מצטערים, לא נוכל לאשר את ההזמנה ל-${when}. נשמח לראות אותך בפעם אחרת!`);
  return `https://wa.me/${waNumber(r.phone)}?text=${encodeURIComponent(text)}`;
}
// "שינוי: 19:00, 2 סועדים ← 20:30, 5 סועדים" (the date only when it changes)
function changeLine(r) {
  const p = r.prev;
  if (!p) return '';
  const dated = p.reservation_date !== r.reservation_date;
  const side = (d, t, g) => `${dated ? formatDisplay(d) + ' ' : ''}${String(t).slice(0, 5)} · ${g} סועדים`;
  return `<div class="res-change">שינוי מבוקש: ${side(p.reservation_date, p.arrival_time, p.guests)} ← ${side(r.reservation_date, r.arrival_time, r.guests)}</div>`;
}
async function setStatus(id, status) {
  const { error } = await db.from('reservations').update({ status }).eq('id', id);
  if (error) saveError = 'השינוי לא נשמר. בדקו את החיבור ונסו שוב.';
  renderList();
}
// Approving or declining a request or a change goes through the database, which also
// restores the original booking when a change is declined (11_booking_changes.sql)
async function decide(id, approve) {
  const { data, error } = await db.rpc('decide_request', { p_id: Number(id), p_approve: approve });
  if (error) saveError = 'התשובה לא נשמרה. בדקו את החיבור ונסו שוב.';
  // a phone notification too, if the customer asked for one (server function notify-booking)
  else if (['confirmed', 'reverted', 'declined'].includes(data))
    db.functions.invoke('notify-booking', { body: { id: Number(id), result: data } }).catch(() => {});
  renderList();
}
let saveError = null;

async function renderList(quiet) {
  const content = document.getElementById('listContent');
  if (!content) return;
  if (!quiet) content.innerHTML = `<p>טוען הזמנות...</p>`;

  const { data: tables, error: tablesError } = await db.from('venue_tables').select('id,name,area,kind').order('sort_order');
  const { data: rows, error: resError } = await db
    .from('reservations')
    .select('id,reservation_date,arrival_time,customer_name,phone,guests,note,assigned_table_id,assigned_kind,status,access_token,prev,changed_at,cancelled_by')
    .eq('reservation_date', currentDate)
    .in('status', ['confirmed', 'pending', 'cancelled'])
    .order('arrival_time');
  if (!document.getElementById('listContent')) return;   // signed out meanwhile

  if (tablesError || resError) {
    if (quiet) return;                                  // a background refresh keeps what's on screen
    content.innerHTML = `<div class="card"><p class="error">ההזמנות לא נטענו. בדקו את החיבור ונסו שוב.</p><button type="button" id="retryBtn">נסו שוב</button></div>`;
    document.getElementById('retryBtn').addEventListener('click', () => renderList());
    return;
  }

  const tableById = Object.fromEntries((tables || []).map(t => [t.id, t]));
  const withTable = r => { const t = tableById[r.assigned_table_id]; return { ...r, area: t ? t.area : 'bar', tableName: t ? t.name : 'בר' }; };
  const pending = (rows || []).filter(r => r.status === 'pending').map(withTable);
  const reservations = (rows || []).filter(r => r.status === 'confirmed').map(withTable);
  const cancelledByCustomer = (rows || []).filter(r => r.status === 'cancelled' && r.cancelled_by === 'customer').map(withTable);
  const totalGuests = reservations.reduce((s, r) => s + r.guests, 0);

  const areaLabels = { high: 'שולחנות גבוהים', low: 'שולחנות נמוכים', bar: 'בר' };
  const groups = {};
  reservations.forEach(r => { (groups[r.area] = groups[r.area] || []).push(r); });

  const rowHtml = (r, actions) => `
      <div class="res-row">
        <span class="res-time">${r.arrival_time.slice(0,5)}</span>
        <span class="res-name">
          ${esc(r.customer_name)} · ${esc(r.tableName)}${r.status === 'confirmed' && r.changed_at ? ' <span class="changed-tag">שונתה ע״י הלקוח</span>' : ''}
          ${r.note ? `<div class="res-note">${esc(r.note)}</div>` : ''}
        </span>
        <span class="res-guests">${r.guests} · ${esc(r.phone)}</span>
        ${actions}
      </div>`;

  let html = `
    <h1>הזמנות ל-${formatDisplay(currentDate)}</h1>
    <div class="summary">${reservations.length} הזמנות · ${totalGuests} סועדים${pending.length ? ` · ${pending.length} ממתינות לאישור` : ''}</div>
    ${saveError ? `<p class="error">${saveError}</p>` : ''}
  `;
  saveError = null;

  if (pending.length) {
    html += `<div class="group-title pending-title">ממתינות לאישור</div><div class="card pending-card">`;
    html += pending.map(r => rowHtml(r, `${changeLine(r)}
        <span class="pending-actions">
          <a class="approve-btn" data-id="${r.id}" href="${waLink(r, true)}" target="_blank" rel="noopener">אישור</a>
          <a class="decline-link" data-id="${r.id}" ${r.prev ? 'data-change' : ''} href="${waLink(r, false)}" target="_blank" rel="noopener">דחייה</a>
        </span>`)).join('');
    html += `</div>`;
  }

  for (const area of ['high', 'low', 'bar']) {
    if (!groups[area]) continue;
    html += `<div class="group-title">${areaLabels[area]}</div><div class="card">`;
    html += groups[area].map(r => rowHtml(r, `<span class="cancel-link" data-id="${r.id}">בטל</span>`)).join('');
    html += `</div>`;
  }

  if (cancelledByCustomer.length) {
    html += `<div class="group-title">בוטלו ע״י הלקוח</div><div class="card cancelled-card">`;
    html += cancelledByCustomer.map(r => rowHtml(r, '')).join('');
    html += `</div>`;
  }

  if (!reservations.length && !pending.length) {
    html += `<div class="card"><p style="color:var(--muted); text-align:center;">אין הזמנות בתאריך הזה.</p></div>`;
  }

  content.innerHTML = html;
  content.querySelectorAll('.cancel-link').forEach(el => {
    el.addEventListener('click', () => {
      if (!confirm('לבטל את ההזמנה הזו?')) return;
      setStatus(el.getAttribute('data-id'), 'cancelled');
    });
  });
  // the link opens WhatsApp; the answer is saved at the same time
  content.querySelectorAll('.approve-btn').forEach(el => {
    el.addEventListener('click', () => decide(el.getAttribute('data-id'), true));
  });
  content.querySelectorAll('.decline-link').forEach(el => {
    el.addEventListener('click', e => {
      const change = el.hasAttribute('data-change');
      if (!confirm(change ? 'לדחות את השינוי? ההזמנה המקורית תישאר בתוקף.' : 'לדחות את הבקשה? השולחן ישתחרר.')) { e.preventDefault(); return; }
      decide(el.getAttribute('data-id'), false);
    });
  });
}

// new requests arrive while the page is open: refresh quietly every minute
setInterval(() => { if (document.visibilityState === 'visible') renderList(true); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') renderList(true); });

start();
</script>
</body>
</html>
