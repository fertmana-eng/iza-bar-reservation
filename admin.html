<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול הזמנות</title>
<style>
  /* The manager's evening screen (tablet, landscape): floor plan beside the
     evening's sheet, like the paper sheet the bar used (table, name, time, guests, comments). */
  :root {
    --ink: #1f1e1c;
    --muted: #6b6862;
    --bg: #f6f4ef;
    --card: #ffffff;
    --border: #e4e0d6;
    --accent: #2f4a3d;
    --accent-light: #eaf1ec;
    --danger: #7a2e2e;
    --pending: #f2c94c;
    --pending-bg: #fffaf0;
    --pending-ink: #8a5a00;
    --arrived: #2fae60;
  }
  * { box-sizing: border-box; min-width: 0; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg); color: var(--ink); padding: 14px 16px 40px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 16px; }
  .login-wrap { max-width: 420px; margin: 40px auto 0; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  input, select, textarea { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    font-size: 16px; font-family: inherit; background: #fff; color: var(--ink); }
  .login-wrap input { margin-bottom: 10px; }
  button, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px;
    padding: 0 16px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 15px;
    font-weight: 600; cursor: pointer; text-decoration: none; font-family: inherit; }
  .login-wrap button { width: 100%; }
  button:disabled { opacity: .5; cursor: default; }
  .btn-light { background: #fff; color: var(--ink); border: 1px solid var(--border); }
  .btn-danger { background: #fff; color: var(--danger); border: 1px solid rgba(122,46,46,.35); }
  .btn-green { background: var(--arrived); }
  .error { color: var(--danger); font-size: 13px; margin: 6px 0; }
  .error[hidden], [hidden] { display: none !important; }

  /* top bar: date, day, totals */
  .topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .day-nav { display: flex; align-items: center; gap: 6px; }
  .day-nav button { min-width: 44px; padding: 0; font-size: 20px; }
  .day-nav input { width: auto; min-height: 44px; }
  .day-title { font-size: 20px; font-weight: 700; margin: 0; }
  .topbar .spacer { flex: 1; }
  .signout-link { all: unset; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; padding: 8px; }
  .summary { color: var(--muted); font-size: 14px; margin: 0 0 12px; }

  .floor { display: grid; grid-template-columns: minmax(320px, 44%) 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .floor { grid-template-columns: 1fr; } }
  .plan-panel { position: sticky; top: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px; }
  .plan-panel svg { display: block; width: 100%; height: auto; max-height: calc(100vh - 130px); touch-action: manipulation; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 6px 4px 0; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-inline-end: 4px; border: 1px solid #bdb6a6; }

  /* floor plan drawing */
  .p-floor { fill: #f3ede0; }
  .p-service { fill: #e2ddd2; }
  .p-wall { stroke: #3d352b; stroke-width: 18; fill: none; stroke-linecap: square; }
  .p-glass { stroke: #9cc7d4; stroke-width: 10; fill: none; }
  .p-bar { stroke: #4a3a2a; stroke-width: 40; fill: none; stroke-linejoin: round; }
  .p-work { fill: #cfc5b3; }
  .p-stairs { fill: none; stroke: #b8ae9c; stroke-width: 3; }
  .p-label { font-size: 30px; fill: #8b8172; font-weight: 600; text-anchor: middle; }
  .tbl { cursor: pointer; }
  .tbl rect { stroke: #bdb6a6; stroke-width: 4; fill: #fff; rx: 8; }
  .tbl .num { font-size: 46px; font-weight: 800; text-anchor: middle; dominant-baseline: central; fill: var(--ink); }
  .tbl .who { font-size: 28px; font-weight: 600; text-anchor: middle; fill: var(--ink); }
  .tbl.booked rect { fill: var(--accent); stroke: var(--accent); }
  .tbl.booked text { fill: #fff; }
  .tbl.pending rect { fill: var(--pending); stroke: #c9a227; }
  .tbl.arrived rect { fill: var(--arrived); stroke: #1f8a4a; }
  .tbl.arrived text { fill: #fff; }
  .moving .tbl.target rect { stroke: #2563eb; stroke-width: 8; stroke-dasharray: 16 10; }
  .moving .tbl.taken { opacity: .35; }
  .bar-hit { cursor: pointer; }
  .bar-count { font-size: 44px; font-weight: 800; fill: #fff; text-anchor: middle; paint-order: stroke; stroke: #4a3a2a; stroke-width: 10; }

  /* the sheet */
  .sheet-card { padding: 0; overflow: hidden; }
  table.sheet { width: 100%; border-collapse: collapse; font-size: 15px; }
  .sheet th { text-align: start; font-size: 12px; color: var(--muted); font-weight: 600; padding: 10px 10px; border-bottom: 2px solid var(--border); background: #fbfaf7; }
  .sheet td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .sheet tr.row { cursor: pointer; }
  .sheet tr.row:hover td { background: #faf8f3; }
  .sheet tr.booked td:first-child { box-shadow: inset -4px 0 0 var(--accent); }
  .sheet tr.pending td { background: var(--pending-bg); }
  .sheet tr.pending td:first-child { box-shadow: inset -4px 0 0 var(--pending); }
  .sheet tr.arrived td:first-child { box-shadow: inset -4px 0 0 var(--arrived); }
  .sheet tr.free td { color: #b3ab9c; }
  .sheet .c-table { font-weight: 800; width: 60px; white-space: nowrap; }
  .sheet .c-time { white-space: nowrap; font-weight: 600; width: 64px; }
  .sheet .c-guests { width: 64px; text-align: center; }
  .sheet .c-note { color: var(--muted); font-size: 13px; }
  .tag { display: inline-block; font-size: 11px; border-radius: 6px; padding: 1px 6px; white-space: nowrap; margin-inline-start: 4px; }
  .tag-pending, .tag-changed { color: var(--pending-ink); background: #f6e7c4; }
  .tag-arrived { color: #fff; background: var(--arrived); }
  .group-title { font-size: 13px; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
  .list-panel > .group-title:first-child { margin-top: 0; }
  .pending-title { color: var(--pending-ink); }
  .pending-card { border-color: #e2c27a; background: var(--pending-bg); }
  .res-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0;
    border-bottom: 1px solid var(--border); font-size: 14px; gap: 8px; flex-wrap: wrap; }
  .res-row:last-child { border-bottom: none; }
  .res-time { font-weight: 600; min-width: 44px; }
  .res-name { flex: 1; padding: 0 6px; }
  .res-guests { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .res-note { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .res-change { flex-basis: 100%; font-size: 13px; color: var(--pending-ink); margin-top: 6px; font-weight: 600; }
  .pending-actions { flex-basis: 100%; display: flex; gap: 14px; align-items: center; margin-top: 8px; }
  .approve-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px;
    background: var(--arrived); color: #fff; border-radius: 10px; font-weight: 600; font-size: 14px; text-decoration: none; }
  .decline-link { color: var(--danger); font-size: 13px; text-decoration: underline; padding: 10px 4px; }
  .cancelled-card { opacity: .6; }
  .cancelled-card .res-name { text-decoration: line-through; }

  /* move banner, messages */
  .move-banner { position: sticky; top: 0; z-index: 5; background: #2563eb; color: #fff; border-radius: 12px; padding: 10px 14px;
    display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-weight: 600; }
  .move-banner button { background: #fff; color: #2563eb; min-height: 36px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px;
    border-radius: 12px; font-size: 14px; z-index: 30; max-width: 90vw; }
  .toast.err { background: var(--danger); }

  /* details / add panel */
  .overlay { position: fixed; inset: 0; background: rgba(20,18,14,.25); z-index: 20; display: flex; justify-content: flex-end; }
  .panel { width: min(420px, 100%); height: 100%; background: var(--card); padding: 18px; overflow-y: auto; box-shadow: 0 0 30px rgba(0,0,0,.2); }
  .panel h2 { margin: 0 0 4px; font-size: 22px; }
  .panel .sub { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
  .panel dl { display: grid; grid-template-columns: 90px 1fr; gap: 8px 10px; margin: 0 0 16px; font-size: 15px; }
  .panel dt { color: var(--muted); }
  .panel dd { margin: 0; font-weight: 600; }
  .panel .actions { display: grid; gap: 10px; margin-top: 12px; }
  .panel .actions .btn, .panel .actions button { width: 100%; }
  .panel .close { all: unset; float: left; font-size: 28px; line-height: 1; padding: 4px 10px; cursor: pointer; color: var(--muted); }
  .panel .field { margin-bottom: 12px; }
  .panel label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .panel .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bar-list { margin: 0 0 14px; padding: 4px 14px; }
</style>
</head>
<body>
<div id="app">טוען...</div>

<script>
  const SUPABASE_URL = "https://brpovhypzsgwsnuenpfj.supabase.co";

</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');
const BUSINESS_NAME = 'עיזה בר';

// Customer text is shown inside HTML: turn < > & " ' into harmless characters first,
// so a name or note can never become code on the page.
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// Today in Israel, whatever the device's time zone (toISOString would give the UTC date).
function todayStr() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jerusalem', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}
function nowTime() {
  return new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Jerusalem', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date());
}
function formatDisplay(dateStr) {
  const [y, m, d] = String(dateStr).split('-').map(Number);
  return `${d}.${m}.${y}`;
}
function addDays(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number), x = new Date(y, m - 1, d + n);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
}
function weekday(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('he-IL', { weekday: 'long' });
}
const tableNumber = t => (t.name.match(/\d+/) || [''])[0];

let currentDate = todayStr();

// Manager login: one username + password. Supabase logins need an email
// address, so the username becomes <username>@izabar.local (not a real inbox).
const LOGIN_DOMAIN = 'izabar.local';

async function start() {
  const { data } = await db.auth.getSession();
  if (data && data.session) renderShell(); else renderLogin();
}

function renderLogin() {
  app.innerHTML = `
    <div class="login-wrap">
      <h1>ניהול הזמנות</h1>
      <form class="card" id="loginForm">
        <input id="userInput" placeholder="שם משתמש" autocomplete="username" autocapitalize="off" spellcheck="false" dir="ltr">
        <input id="passInput" type="password" placeholder="סיסמה" autocomplete="current-password" dir="ltr">
        <div class="error" id="loginError" hidden></div>
        <button type="submit" id="loginBtn">כניסה</button>
      </form>
    </div>`;
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const user = document.getElementById('userInput').value.trim().toLowerCase();
    const password = document.getElementById('passInput').value;
    const errEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    errEl.hidden = true;
    if (!user || !password) { errEl.textContent = 'נא למלא שם משתמש וסיסמה.'; errEl.hidden = false; return; }
    btn.disabled = true; btn.textContent = 'נכנס...';
    const { error } = await db.auth.signInWithPassword({ email: user + '@' + LOGIN_DOMAIN, password });
    if (error) {
      errEl.textContent = error.status === 400 ? 'שם משתמש או סיסמה שגויים.' : 'אין חיבור לשרת, נסו שוב.';
      errEl.hidden = false; btn.disabled = false; btn.textContent = 'כניסה';
      return;
    }
    renderShell();
  });
}

async function signOut() {
  closePanel(); moving = null;
  await db.auth.signOut();
  renderLogin();
}

function renderShell() {
  app.innerHTML = `
    <div class="topbar">
      <div class="day-nav">
        <button type="button" id="prevDay" aria-label="היום הקודם">›</button>
        <input id="dateInput" type="date" value="${currentDate}">
        <button type="button" id="nextDay" aria-label="היום הבא">‹</button>
      </div>
      <h1 class="day-title" id="dayTitle"></h1>
      <span class="spacer"></span>
      <button type="button" id="addBtn">+ הזמנה חדשה</button>
      <button type="button" class="signout-link" id="signOutBtn">יציאה</button>
    </div>
    <div id="listContent">טוען...</div>`;
  document.getElementById('signOutBtn').addEventListener('click', signOut);
  const go = d => { currentDate = d; document.getElementById('dateInput').value = d; moving = null; renderList(); };
  document.getElementById('dateInput').addEventListener('change', e => go(e.target.value));
  document.getElementById('prevDay').addEventListener('click', () => go(addDays(currentDate, -1)));
  document.getElementById('nextDay').addEventListener('click', () => go(addDays(currentDate, 1)));
  document.getElementById('addBtn').addEventListener('click', () => openAdd(null));
  renderList();
}

// ---------- WhatsApp messages to the customer (the tablet has the bar's WhatsApp) ----------
function waNumber(phone) {
  const d = String(phone).replace(/\D/g, '');
  return d.startsWith('972') ? d : d.startsWith('0') ? '972' + d.slice(1) : d;
}
function bookingLink(r) {
  return r.access_token ? `\nלצפייה, שינוי או ביטול: ${new URL('booking.html#' + r.access_token, location.href).href}` : '';
}
// r.prev: the confirmed details kept while a change the customer made waits for approval
function waLink(r, approve) {
  const when = `${formatDisplay(r.reservation_date || currentDate)} בשעה ${r.arrival_time.slice(0, 5)}`;
  const p = r.prev, prevWhen = p ? `${formatDisplay(p.reservation_date)} בשעה ${String(p.arrival_time).slice(0, 5)}` : '';
  const text = p
    ? (approve
      ? `שלום ${r.customer_name}, השינוי בהזמנה שלך ל${BUSINESS_NAME} אושר ✳\n${when}, שולחן ל-${r.guests}.\nנחכה עד 15 דקות משעת ההזמנה. מחכים לך!` + bookingLink(r)
      : `שלום ${r.customer_name}, מצטערים, לא נוכל לאשר את השינוי בהזמנה שלך ל${BUSINESS_NAME}. ההזמנה המקורית שלך בתוקף: ${prevWhen}, שולחן ל-${p.guests}.` + bookingLink(r))
    : (approve
      ? `שלום ${r.customer_name}, ההזמנה שלך ל${BUSINESS_NAME} אושרה ✳\n${when}, שולחן ל-${r.guests}.\nנחכה עד 15 דקות משעת ההזמנה. מחכים לך!` + bookingLink(r)
      : `שלום ${r.customer_name}, תודה שפנית ל${BUSINESS_NAME}. מצטערים, לא נוכל לאשר את ההזמנה ל-${when}. נשמח לראות אותך בפעם אחרת!`);
  return `https://wa.me/${waNumber(r.phone)}?text=${encodeURIComponent(text)}`;
}
// "שינוי מבוקש: 19:00 · 2 סועדים ← 20:30 · 5 סועדים" (the date only when it changes)
function changeLine(r) {
  const p = r.prev;
  if (!p) return '';
  const dated = p.reservation_date !== r.reservation_date;
  const side = (d, t, g) => `${dated ? formatDisplay(d) + ' ' : ''}${String(t).slice(0, 5)} · ${g} סועדים`;
  return `<div class="res-change">שינוי מבוקש: ${side(p.reservation_date, p.arrival_time, p.guests)} ← ${side(r.reservation_date, r.arrival_time, r.guests)}</div>`;
}

// ---------- actions ----------
let saveError = null, toastTimer = null;
function toast(text, err) {
  document.getElementById('toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : ''); t.id = 'toast'; t.textContent = text;
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 4000);
}
async function setStatus(id, status) {
  const { error } = await db.from('reservations').update({ status }).eq('id', id);
  if (error) saveError = 'השינוי לא נשמר. בדקו את החיבור ונסו שוב.';
  closePanel(); renderList();
}
// Approving or declining a request or a change goes through the database, which also
// restores the original booking when a change is declined (11_booking_changes.sql)
async function decide(id, approve) {
  const { data, error } = await db.rpc('decide_request', { p_id: Number(id), p_approve: approve });
  if (error) saveError = 'התשובה לא נשמרה. בדקו את החיבור ונסו שוב.';
  // a phone notification too, if the customer asked for one (server function notify-booking)
  else if (['confirmed', 'reverted', 'declined'].includes(data))
    db.functions.invoke('notify-booking', { body: { id: Number(id), result: data } }).catch(() => {});
  closePanel(); renderList();
}
async function setArrived(id, arrived) {
  const { data, error } = await db.rpc('set_arrived', { p_id: Number(id), p_arrived: arrived });
  if (error || data !== 'saved') toast('לא נשמר. נסו שוב.', true);
  closePanel(); renderList();
}
// Move: tap "העברה לשולחן אחר", then tap the new table on the plan or in the sheet
let moving = null;
function startMove(r) { moving = r; closePanel(); renderList(true); }
async function moveTo(tableId) {
  const r = moving; moving = null;
  const { data, error } = await db.rpc('move_booking', { p_id: Number(r.id), p_table: Number(tableId) });
  const texts = { moved: ['ההזמנה הועברה.'], moved_size: ['ההזמנה הועברה. שימו לב: השולחן בגודל אחר מהרגיל לקבוצה הזו.'],
    taken: ['השולחן הזה תפוס.', true], full: ['אין מספיק מקום בבר.', true], unchanged: ['זה אותו שולחן.'] };
  const [text, err] = error ? ['ההעברה לא נשמרה. נסו שוב.', true] : texts[data] || ['ההעברה לא נשמרה.', true];
  toast(text, err);
  renderList();
}

// ---------- the floor plan (drawn from the old architect's plan; units ≈ 0.84 cm) ----------
// Which numbered table is where: Claude's first guess, to be corrected by the owner.
const PLAN_TABLES = {
  'שולחן 3':  { x: 375,  y: 525,  w: 140, h: 75 },
  'שולחן 1':  { x: 375,  y: 742,  w: 95,  h: 92 },
  'שולחן 2':  { x: 375,  y: 955,  w: 95,  h: 90 },
  'שולחן 18': { x: 1185, y: 1110, w: 70,  h: 95 },
  'שולחן 4':  { x: 1185, y: 1325, w: 70,  h: 95 },
  'שולחן 6':  { x: 1015, y: 1590, w: 240, h: 55 },
  'שולחן 7':  { x: 225,  y: 1300, w: 120, h: 225 },
};
const BAR_PATH = 'M618,705 L618,1185 L720,1385 L800,1385 L1005,1240 L1005,830 L935,690';
const WALLS = ['M365,415 L365,1105 L330,1105 L40,1275 L40,1320', 'M40,1530 L40,1690 L150,1690', 'M350,1690 L370,1690',
  'M1255,1690 L1285,1690 L1285,415 L1100,415', 'M1010,415 L800,415', 'M680,415 L365,415',
  'M530,415 L530,45 L1610,45 L1610,1260 L1305,1260 L1305,415', 'M840,380 L840,700'];
const GLASS = ['M150,1690 L350,1690', 'M370,1690 L690,1690', 'M1005,1690 L1255,1690', 'M40,1320 L40,1530'];

function tableState(r) {
  if (!r) return 'free';
  if (r.status === 'pending') return 'pending';
  return r.arrived_at ? 'arrived' : 'booked';
}
function planSvg(d) {
  const tables = d.tables.filter(t => t.kind === 'table' && PLAN_TABLES[t.name]);
  const bar = d.tables.find(t => t.kind === 'bar_pool');
  const steps = Array.from({ length: 16 }, (_, i) => `<line x1="1165" x2="1265" y1="${650 + i * 22}" y2="${650 + i * 22}"/>`).join('');
  const tblSvg = tables.map(t => {
    const p = PLAN_TABLES[t.name], r = d.byTable[t.id], st = tableState(r);
    const moveCls = moving ? (r && r.id !== moving.id ? ' taken' : !r ? ' target' : '') : '';
    const cx = p.x + p.w / 2, cy = p.y + p.h / 2, big = p.h >= 90 && p.w >= 90;
    return `<g class="tbl ${st}${moveCls}" data-table="${t.id}" role="button" aria-label="${esc(t.name)}${r ? ' · ' + esc(r.customer_name) : ' · פנוי'}">
      <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}"/>
      <text class="num" x="${cx}" y="${big && r ? cy - 20 : cy}">${tableNumber(t)}</text>
      ${r && big ? `<text class="who" x="${cx}" y="${cy + 30}">${r.arrival_time.slice(0, 5)}</text>` : ''}
    </g>`;
  }).join('');
  const barUsed = d.barRows.reduce((s, r) => s + r.guests, 0);
  return `<svg viewBox="15 395 1295 1320" role="img" aria-label="תוכנית הבר" id="plan">
    <polygon class="p-service" points="530,45 1610,45 1610,1260 1285,1260 1285,415 530,415"/>
    <polygon class="p-floor" points="365,415 1285,415 1285,1690 40,1690 40,1275 330,1105 365,1105"/>
    <g class="p-stairs">${steps}<rect x="1165" y="650" width="100" height="352"/></g>
    <text class="p-label" x="1215" y="1060" style="font-size:24px">מדרגות</text>
    ${WALLS.map(w => `<path class="p-wall" d="${w}"/>`).join('')}
    ${GLASS.map(w => `<path class="p-glass" d="${w}"/>`).join('')}
    <g class="bar-hit" data-table="${bar ? bar.id : ''}" role="button" aria-label="בר">
      <path class="p-bar" d="${BAR_PATH}"/>
      <rect class="p-work" x="640" y="760" width="45" height="420"/><rect class="p-work" x="925" y="880" width="50" height="310"/>
      <rect class="p-work" x="795" y="1030" width="60" height="140"/>
      <text class="bar-count" x="810" y="1290">בר</text>
      <text class="bar-count" x="810" y="1345" id="barCount" direction="ltr">${barUsed}/${bar ? bar.pool_capacity : 12}</text>
    </g>
    <text class="p-label" x="740" y="1665">כניסה</text>
    <text class="p-label" x="190" y="1660">לאונג׳</text>
    ${tblSvg}
  </svg>`;
}

// ---------- loading and drawing the evening ----------
let lastData = null;
async function renderList(quiet) {
  const content = document.getElementById('listContent');
  if (!content) return;
  if (!quiet) content.innerHTML = `<p>טוען הזמנות...</p>`;
  document.getElementById('dayTitle').textContent = `${weekday(currentDate)} · ${formatDisplay(currentDate)}`;

  const [{ data: tables, error: tablesError }, { data: rows, error: resError }] = await Promise.all([
    db.from('venue_tables').select('id,name,area,kind,min_guests,max_guests,pool_capacity,sort_order').order('sort_order'),
    db.from('reservations')
      .select('id,reservation_date,arrival_time,customer_name,phone,guests,note,assigned_table_id,assigned_kind,status,access_token,prev,changed_at,cancelled_by,arrived_at')
      .eq('reservation_date', currentDate)
      .in('status', ['confirmed', 'pending', 'cancelled'])
      .order('arrival_time')
  ]);
  if (!document.getElementById('listContent')) return;   // signed out meanwhile

  if (tablesError || resError) {
    if (quiet) return;                                  // a background refresh keeps what's on screen
    content.innerHTML = `<div class="card"><p class="error">ההזמנות לא נטענו. בדקו את החיבור ונסו שוב.</p><button type="button" id="retryBtn">נסו שוב</button></div>`;
    document.getElementById('retryBtn').addEventListener('click', () => renderList());
    return;
  }

  const tableById = Object.fromEntries((tables || []).map(t => [t.id, t]));
  const withTable = r => { const t = tableById[r.assigned_table_id];
    return { ...r, table: t, tableName: t && t.kind === 'table' ? t.name : 'בר' }; };
  const all = (rows || []).map(withTable);
  const active = all.filter(r => r.status === 'confirmed' || r.status === 'pending');
  const pending = active.filter(r => r.status === 'pending');
  const confirmed = active.filter(r => r.status === 'confirmed');
  const cancelledByCustomer = all.filter(r => r.status === 'cancelled' && r.cancelled_by === 'customer');
  const byTable = {};
  active.forEach(r => { if (r.table && r.table.kind === 'table') byTable[r.table.id] = r; });
  const barRows = active.filter(r => !r.table || r.table.kind !== 'table');
  const d = lastData = { tables: tables || [], byTable, barRows, active };

  const guests = confirmed.reduce((s, r) => s + r.guests, 0);
  const arrived = confirmed.filter(r => r.arrived_at).length;
  let html = `
    ${moving ? `<div class="move-banner" id="moveBanner">בחרו שולחן חדש עבור ${esc(moving.customer_name)} (${moving.guests} סועדים)
      <span style="flex:1"></span><button type="button" id="moveCancel">ביטול</button></div>` : ''}
    <p class="summary" id="summary">${confirmed.length} הזמנות · ${guests} סועדים${pending.length ? ` · ${pending.length} ממתינות לאישור` : ''}${arrived ? ` · ${arrived} הגיעו` : ''}</p>
    ${saveError ? `<p class="error">${saveError}</p>` : ''}
    <div class="floor${moving ? ' moving' : ''}">
      <section class="plan-panel">${planSvg(d)}
        <div class="legend"><span><i style="background:#fff"></i>פנוי</span><span><i style="background:var(--accent)"></i>מוזמן</span>
          <span><i style="background:var(--pending)"></i>ממתין לאישור</span><span><i style="background:var(--arrived)"></i>הגיעו</span></div>
      </section>
      <section class="list-panel">`;
  saveError = null;

  if (pending.length) {
    html += `<div class="group-title pending-title">ממתינות לאישור</div><div class="card pending-card">`;
    html += pending.map(r => `
      <div class="res-row">
        <span class="res-time">${r.arrival_time.slice(0, 5)}</span>
        <span class="res-name">${esc(r.customer_name)} · ${esc(r.tableName)}${r.note ? `<div class="res-note">${esc(r.note)}</div>` : ''}</span>
        <span class="res-guests">${r.guests} · ${esc(r.phone)}</span>
        ${changeLine(r)}
        <span class="pending-actions">
          <a class="approve-btn" data-id="${r.id}" href="${waLink(r, true)}" target="_blank" rel="noopener">אישור</a>
          <a class="decline-link" data-id="${r.id}" ${r.prev ? 'data-change' : ''} href="${waLink(r, false)}" target="_blank" rel="noopener">דחייה</a>
        </span>
      </div>`).join('');
    html += `</div>`;
  }

  // the sheet: one row per table (like the paper), then the bar's bookings
  const sheetRow = (t, r, label) => `<tr class="row ${tableState(r)}" data-table="${t ? t.id : ''}" ${r ? `data-id="${r.id}"` : ''}>
      <td class="c-table">${label}</td>
      <td class="c-name">${r ? esc(r.customer_name) : ''}${r && r.status === 'pending' ? ' <span class="tag tag-pending">ממתין</span>' : ''}${r && r.status === 'confirmed' && r.changed_at ? ' <span class="tag tag-changed">שונתה ע״י הלקוח</span>' : ''}${r && r.arrived_at ? ' <span class="tag tag-arrived">הגיעו ✓</span>' : ''}</td>
      <td class="c-time">${r ? r.arrival_time.slice(0, 5) : ''}</td>
      <td class="c-guests">${r ? r.guests : ''}</td>
      <td class="c-note">${r && r.note ? esc(r.note) : ''}</td>
    </tr>`;
  const planTables = d.tables.filter(t => t.kind === 'table').sort((a, b) => Number(tableNumber(a)) - Number(tableNumber(b)));
  const bar = d.tables.find(t => t.kind === 'bar_pool');
  html += `<div class="card sheet-card"><table class="sheet" id="sheet">
    <thead><tr><th>שולחן</th><th>שם</th><th>שעה</th><th>סועדים</th><th>הערות</th></tr></thead><tbody>
    ${planTables.map(t => sheetRow(t, byTable[t.id], tableNumber(t))).join('')}
    ${barRows.map(r => sheetRow(bar, r, 'בר')).join('')}
    ${bar ? `<tr class="row free add-bar" data-table="${bar.id}"><td class="c-table">בר</td><td colspan="4">+ הוספה לבר</td></tr>` : ''}
    </tbody></table></div>`;

  if (cancelledByCustomer.length) {
    html += `<div class="group-title">בוטלו ע״י הלקוח</div><div class="card cancelled-card">`;
    html += cancelledByCustomer.map(r => `<div class="res-row"><span class="res-time">${r.arrival_time.slice(0, 5)}</span>
      <span class="res-name">${esc(r.customer_name)} · ${esc(r.tableName)}</span><span class="res-guests">${r.guests} · ${esc(r.phone)}</span></div>`).join('');
    html += `</div>`;
  }
  html += `</section></div>`;
  content.innerHTML = html;
  bindList(d);
}

function bindDecisions(root) {
  // the link opens WhatsApp; the answer is saved at the same time
  root.querySelectorAll('.approve-btn').forEach(el => el.addEventListener('click', () => decide(el.dataset.id, true)));
  root.querySelectorAll('.decline-link').forEach(el => el.addEventListener('click', e => {
    const change = el.hasAttribute('data-change');
    if (!confirm(change ? 'לדחות את השינוי? ההזמנה המקורית תישאר בתוקף.' : 'לדחות את הבקשה? השולחן ישתחרר.')) { e.preventDefault(); return; }
    decide(el.dataset.id, false);
  }));
}
function bindList(d) {
  const content = document.getElementById('listContent');
  bindDecisions(content);
  document.getElementById('moveCancel')?.addEventListener('click', () => { moving = null; renderList(true); });
  const pick = (tableId, bookingId) => {
    if (moving) return tableId ? moveTo(tableId) : null;
    const t = d.tables.find(x => String(x.id) === String(tableId));
    const r = bookingId ? d.active.find(x => String(x.id) === String(bookingId)) : t && t.kind === 'table' ? d.byTable[t.id] : null;
    if (r) openBooking(r);
    else if (t && t.kind === 'bar_pool') openBar(t, d);
    else if (t) openAdd(t);
  };
  content.querySelectorAll('.tbl, .bar-hit').forEach(el => el.addEventListener('click', () => pick(el.dataset.table)));
  content.querySelectorAll('#sheet tr.row').forEach(el => el.addEventListener('click', () =>
    pick(el.dataset.table, el.classList.contains('add-bar') ? null : el.dataset.id)));
}

// ---------- the side panel: a booking, the bar, or a new booking ----------
function openPanel(html) {
  closePanel();
  const o = document.createElement('div');
  o.className = 'overlay'; o.id = 'overlay';
  o.innerHTML = `<div class="panel" id="panel" role="dialog"><button type="button" class="close" id="panelClose" aria-label="סגירה">×</button>${html}</div>`;
  o.addEventListener('click', e => { if (e.target === o) closePanel(); });
  document.body.appendChild(o);
  document.getElementById('panelClose').addEventListener('click', closePanel);
}
function closePanel() { document.getElementById('overlay')?.remove(); }

function openBooking(r) {
  const pending = r.status === 'pending';
  openPanel(`
    <h2>${esc(r.tableName)} · ${esc(r.customer_name)}</h2>
    <p class="sub">${pending ? 'ממתינה לאישור' : r.arrived_at ? 'הגיעו ✓' : 'מוזמן'}${r.changed_at && !pending ? ' · שונתה ע״י הלקוח' : ''}</p>
    <dl>
      <dt>שעה</dt><dd>${r.arrival_time.slice(0, 5)}</dd>
      <dt>סועדים</dt><dd>${r.guests}</dd>
      <dt>טלפון</dt><dd dir="ltr" style="text-align:right">${esc(r.phone) || '—'}</dd>
      <dt>הערה</dt><dd>${r.note ? esc(r.note) : '—'}</dd>
    </dl>
    ${changeLine(r)}
    <div class="actions">
      ${pending ? `<a class="btn btn-green approve-btn" data-id="${r.id}" href="${waLink(r, true)}" target="_blank" rel="noopener">אישור</a>
        <a class="btn btn-danger decline-link" data-id="${r.id}" ${r.prev ? 'data-change' : ''} href="${waLink(r, false)}" target="_blank" rel="noopener">דחייה</a>`
      : `<button type="button" class="btn-green" id="arrivedBtn">${r.arrived_at ? 'ביטול סימון "הגיעו"' : 'הגיעו ✓'}</button>`}
      <button type="button" class="btn-light" id="moveBtn">העברה לשולחן אחר</button>
      ${r.phone ? `<a class="btn btn-light" id="waBtn" href="https://wa.me/${waNumber(r.phone)}" target="_blank" rel="noopener">וואטסאפ ללקוח</a>` : ''}
      ${pending ? '' : `<button type="button" class="btn-danger" id="cancelBtn">ביטול ההזמנה</button>`}
    </div>`);
  bindDecisions(document.getElementById('panel'));
  document.getElementById('arrivedBtn')?.addEventListener('click', () => setArrived(r.id, !r.arrived_at));
  document.getElementById('moveBtn').addEventListener('click', () => startMove(r));
  document.getElementById('cancelBtn')?.addEventListener('click', () => {
    if (confirm('לבטל את ההזמנה הזו?')) setStatus(r.id, 'cancelled');
  });
}

function openBar(t, d) {
  const used = d.barRows.reduce((s, r) => s + r.guests, 0);
  openPanel(`
    <h2>בר</h2>
    <p class="sub">${used} מתוך ${t.pool_capacity} מקומות תפוסים</p>
    <div class="card bar-list">${d.barRows.length ? d.barRows.map(r => `<div class="res-row bar-row" data-id="${r.id}" style="cursor:pointer">
      <span class="res-time">${r.arrival_time.slice(0, 5)}</span><span class="res-name">${esc(r.customer_name)}</span>
      <span class="res-guests">${r.guests} סועדים</span></div>`).join('') : '<p class="sub" style="margin:8px 0">אין הזמנות בבר.</p>'}</div>
    <div class="actions"><button type="button" id="barAdd">+ הוספת הזמנה לבר</button></div>`);
  document.querySelectorAll('.bar-row').forEach(el => el.addEventListener('click', () =>
    openBooking(d.barRows.find(r => String(r.id) === el.dataset.id))));
  document.getElementById('barAdd').addEventListener('click', () => openAdd(t));
}

// A booking that came by phone / WhatsApp or at the door: confirmed at once, no same-day rules
function openAdd(t) {
  const times = [];
  for (let m = 12 * 60; m <= 23 * 60 + 45; m += 15) times.push(`${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`);
  let def = '19:00';
  if (currentDate === todayStr()) {
    const [h, mm] = nowTime().split(':').map(Number), q = Math.ceil((h * 60 + mm) / 15) * 15;
    def = times.find(x => { const [a, b] = x.split(':').map(Number); return a * 60 + b >= q; }) || '23:45';
  }
  const tables = (lastData ? lastData.tables : []).filter(x => x.kind === 'table')
    .sort((a, b) => Number(tableNumber(a)) - Number(tableNumber(b)));
  const bar = lastData && lastData.tables.find(x => x.kind === 'bar_pool');
  openPanel(`
    <h2>הזמנה חדשה</h2>
    <p class="sub">${formatDisplay(currentDate)} · טלפון, וואטסאפ או הגעה למקום. מאושרת מיד.</p>
    <form id="addForm">
      <div class="field"><label for="addTable">שולחן</label><select id="addTable">
        <option value="">שיבוץ אוטומטי</option>
        ${tables.map(x => `<option value="${x.id}" ${t && t.id === x.id ? 'selected' : ''}>שולחן ${tableNumber(x)} (${x.min_guests}-${x.max_guests})</option>`).join('')}
        ${bar ? `<option value="${bar.id}" ${t && t.id === bar.id ? 'selected' : ''}>בר</option>` : ''}
      </select></div>
      <div class="field"><label for="addName">שם</label><input id="addName" maxlength="80" placeholder="לא חובה"></div>
      <div class="field"><label for="addPhone">טלפון</label><input id="addPhone" type="tel" maxlength="20" placeholder="לא חובה" dir="ltr"></div>
      <div class="row2">
        <div class="field"><label for="addTime">שעה</label><select id="addTime">${times.map(x => `<option ${x === def ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
        <div class="field"><label for="addGuests">סועדים</label><select id="addGuests">${Array.from({ length: 20 }, (_, i) =>
          `<option ${i + 1 === 2 ? 'selected' : ''}>${i + 1}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label for="addNote">הערה</label><textarea id="addNote" rows="2" maxlength="300"></textarea></div>
      <p class="error" id="addError" hidden></p>
      <div class="actions"><button type="submit" id="addSave">שמירת ההזמנה</button></div>
    </form>`);
  document.getElementById('addForm').addEventListener('submit', async e => {
    e.preventDefault();
    const errEl = document.getElementById('addError'), btn = document.getElementById('addSave');
    const phone = document.getElementById('addPhone').value.trim();
    if (phone && !/^[0-9+() -]{7,20}$/.test(phone)) { errEl.textContent = 'מספר הטלפון לא תקין.'; errEl.hidden = false; return; }
    btn.disabled = true; btn.textContent = 'שומר...';
    const table = document.getElementById('addTable').value;
    const { data, error } = await db.rpc('manager_add_booking', { p_date: currentDate, p_time: document.getElementById('addTime').value,
      p_name: document.getElementById('addName').value, p_phone: phone, p_guests: Number(document.getElementById('addGuests').value),
      p_note: document.getElementById('addNote').value, p_table: table ? Number(table) : null });
    const result = data && data[0] && data[0].result;
    if (!error && result === 'confirmed') { closePanel(); toast('ההזמנה נשמרה.'); renderList(); return; }
    errEl.textContent = error ? 'ההזמנה לא נשמרה. בדקו את החיבור ונסו שוב.'
      : { taken: 'השולחן הזה כבר תפוס.', full: 'אין מקום מתאים. בחרו שולחן אחר או מספר סועדים אחר.', invalid: 'אחד הפרטים לא תקין.' }[result] || 'ההזמנה לא נשמרה.';
    errEl.hidden = false; btn.disabled = false; btn.textContent = 'שמירת ההזמנה';
  });
}

// new requests arrive while the page is open: refresh quietly every minute
// (not while a panel is open or a move is being chosen)
const quietRefresh = () => { if (document.visibilityState === 'visible' && !document.getElementById('overlay') && !moving) renderList(true); };
setInterval(quietRefresh, 60000);
document.addEventListener('visibilitychange', quietRefresh);

start();
</script>
</body>
</html>
