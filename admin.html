<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול הזמנות</title>
<style>
  :root {
    --ink: #1f1e1c;
    --muted: #6b6862;
    --bg: #f6f4ef;
    --card: #ffffff;
    --border: #e4e0d6;
    --accent: #2f4a3d;
    --accent-light: #eaf1ec;
    --danger: #7a2e2e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 20px 14px 60px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
  }
  input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 15px;
    margin-bottom: 10px;
  }
  button {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    height: 44px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .error { color: var(--danger); font-size: 13px; margin-bottom: 10px; }
  .group-title {
    font-size: 13px;
    color: var(--muted);
    margin: 20px 0 8px;
    font-weight: 600;
  }
  .res-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    gap: 8px;
  }
  .res-row:last-child { border-bottom: none; }
  .res-time { font-weight: 600; min-width: 44px; }
  .res-name { flex: 1; padding: 0 6px; }
  .res-guests { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .res-note { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .summary { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .top-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .signout-link {
    all: unset;
    color: var(--muted);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
  }
  .error[hidden] { display: none; }
  .cancel-link {
    color: var(--danger);
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="wrap" id="app">טוען...</div>

<!-- ================= CONFIGURATION ================= -->
<script>
  const SUPABASE_URL = "https://brpovhypzsgwsnuenpfj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_FG6kYV7D4D7iDXYYHGrysw_bJ-ag_0e";
</script>
<!-- =================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');

// Today in Israel, whatever the phone's time zone (toISOString would give the UTC date).
function todayStr() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jerusalem', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}

function formatDisplay(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric', year: 'numeric' });
}

let currentDate = todayStr();

// Manager login: one username + password. Supabase logins need an email
// address, so the username becomes <username>@izabar.local (not a real inbox).
const LOGIN_DOMAIN = 'izabar.local';

async function start() {
  const { data } = await db.auth.getSession();
  if (data && data.session) renderShell(); else renderLogin();
}

function renderLogin() {
  app.innerHTML = `
    <h1>ניהול הזמנות</h1>
    <form class="card" id="loginForm">
      <input id="userInput" placeholder="שם משתמש" autocomplete="username" autocapitalize="off" spellcheck="false" dir="ltr">
      <input id="passInput" type="password" placeholder="סיסמה" autocomplete="current-password" dir="ltr">
      <div class="error" id="loginError" hidden></div>
      <button type="submit" id="loginBtn">כניסה</button>
    </form>
  `;
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const user = document.getElementById('userInput').value.trim().toLowerCase();
    const password = document.getElementById('passInput').value;
    const errEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    errEl.hidden = true;
    if (!user || !password) { errEl.textContent = 'נא למלא שם משתמש וסיסמה.'; errEl.hidden = false; return; }
    btn.disabled = true; btn.textContent = 'נכנס...';
    const { error } = await db.auth.signInWithPassword({ email: user + '@' + LOGIN_DOMAIN, password });
    if (error) {
      errEl.textContent = error.status === 400 ? 'שם משתמש או סיסמה שגויים.' : 'אין חיבור לשרת, נסו שוב.';
      errEl.hidden = false; btn.disabled = false; btn.textContent = 'כניסה';
      return;
    }
    renderShell();
  });
}

async function signOut() {
  await db.auth.signOut();
  renderLogin();
}

async function renderShell() {
  app.innerHTML = `
    <div class="top-bar"><button type="button" class="signout-link" id="signOutBtn">יציאה</button></div>
    <div class="field" style="margin-bottom:16px;">
      <input id="dateInput" type="date" value="${currentDate}">
    </div>
    <div id="listContent">טוען...</div>
  `;
  document.getElementById('signOutBtn').addEventListener('click', signOut);
  document.getElementById('dateInput').addEventListener('change', (e) => {
    currentDate = e.target.value;
    renderList();
  });
  renderList();
}

async function renderList() {
  const content = document.getElementById('listContent');
  content.innerHTML = `<p>טוען הזמנות...</p>`;

  const { data: tables, error: tablesError } = await db.from('venue_tables').select('id,name,area,kind').order('sort_order');
  const { data: reservations, error: resError } = await db
    .from('reservations')
    .select('id,arrival_time,customer_name,phone,guests,note,assigned_table_id,assigned_kind,status')
    .eq('reservation_date', currentDate)
    .eq('status', 'confirmed')
    .order('arrival_time');

  if (tablesError || resError) {
    content.innerHTML = `<div class="card"><p class="error">ההזמנות לא נטענו. בדקו את החיבור ונסו שוב.</p><button type="button" id="retryBtn">נסו שוב</button></div>`;
    document.getElementById('retryBtn').addEventListener('click', renderList);
    return;
  }

  const tableById = Object.fromEntries((tables || []).map(t => [t.id, t]));
  const totalGuests = (reservations || []).reduce((s, r) => s + r.guests, 0);

  const areaLabels = { high: 'שולחנות גבוהים', low: 'שולחנות נמוכים', bar: 'בר' };
  const groups = {};
  (reservations || []).forEach(r => {
    const t = tableById[r.assigned_table_id];
    const area = t ? t.area : 'bar';
    if (!groups[area]) groups[area] = [];
    groups[area].push({ ...r, tableName: t ? t.name : 'בר' });
  });

  let html = `
    <h1>הזמנות ל-${formatDisplay(currentDate)}</h1>
    <div class="summary">${(reservations || []).length} הזמנות · ${totalGuests} סועדים</div>
  `;

  for (const area of ['high', 'low', 'bar']) {
    if (!groups[area]) continue;
    html += `<div class="group-title">${areaLabels[area]}</div><div class="card">`;
    html += groups[area].map(r => `
      <div class="res-row">
        <span class="res-time">${r.arrival_time.slice(0,5)}</span>
        <span class="res-name">
          ${r.customer_name} · ${r.tableName}
          ${r.note ? `<div class="res-note">${r.note}</div>` : ''}
        </span>
        <span class="res-guests">${r.guests} · ${r.phone}</span>
        <span class="cancel-link" data-id="${r.id}">בטל</span>
      </div>
    `).join('');
    html += `</div>`;
  }

  if (!(reservations || []).length) {
    html += `<div class="card"><p style="color:var(--muted); text-align:center;">אין הזמנות בתאריך הזה.</p></div>`;
  }

  content.innerHTML = html;
  document.querySelectorAll('.cancel-link').forEach(el => {
    el.addEventListener('click', async () => {
      if (!confirm('לבטל את ההזמנה הזו?')) return;
      const id = el.getAttribute('data-id');
      await db.from('reservations').update({ status: 'cancelled' }).eq('id', id);
      renderList();
    });
  });
}

start();
</script>
</body>
</html>
