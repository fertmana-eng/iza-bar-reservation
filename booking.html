<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>ההזמנה שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  /* Same look as the manager's tablet screen (admin.html): light background, white
     rounded boxes, dark green buttons, the system font, the red IZAZOO logo.
     (Heebo is still loaded: the booking card picture is drawn with it.) */
  :root {
    --paper: #f6f4ef;
    --card: #ffffff;
    --ink: #1f1e1c;
    --ink-soft: #6b6862;
    --line: #e4e0d6;
    --muted: #6b6862;
    --field-bg: #ffffff;
    --field-border: #e4e0d6;
    --accent: #2f4a3d;
    --danger: #7a2e2e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }
  .header-band { background: var(--paper); border-bottom: 1px solid var(--line); padding: 14px 20px; text-align: center; }
  .title-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .venue-name { margin: 0; }
  .slash-big { font-weight: 700; font-size: 22px; color: var(--line); }
  .venue-logo { display: block; height: 24px; width: auto; }
  .venue-tag { color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap; }
  .page { max-width: 420px; width: 100%; margin: 16px auto 64px; padding: 22px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  @media (max-width: 452px) { .page { margin: 16px 16px 64px; width: auto; } }
  .status { text-align: center; font-weight: 700; font-size: 15px; margin: 0 0 16px; }
  .status span { display: inline-block; padding: 6px 14px; border-radius: 999px; }
  .s-confirmed { background: #dcefe2; color: #1d6b3a; }
  .s-pending { background: #f6e7c4; color: #7a5200; }
  .s-cancelled, .s-declined { background: #efece5; color: var(--ink-soft); }
  .card-preview { display: block; width: min(320px, 86%); margin: 0 auto 22px; border-radius: 6px; box-shadow: 0 6px 24px rgba(28,22,16,.18); }
  .closed-box { text-align: center; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 22px 0; margin-bottom: 22px; }
  .closed-box h2 { font-weight: 900; font-size: 24px; margin: 0 0 8px; }
  .closed-box p { margin: 4px 0; color: var(--ink-soft); }
  label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  .section-title { font-weight: 700; font-size: 15px; margin: 0 0 12px; }
  .change-box { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 16px 0 18px; margin: 0 0 22px; }
  .change-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .change-grid .field { margin-bottom: 0; }
  input[type=date], select { width: 100%; height: 48px; background: var(--field-bg); border: 1px solid var(--field-border); border-radius: 10px;
    padding: 0 10px; font-size: 16px; font-family: inherit; color: var(--ink); }
  .pending-note { background: #f6e7c4; color: #5c3d00; border-radius: 6px; padding: 10px 12px; font-size: 14px; margin: 0 0 18px; text-align: center; }
  textarea { width: 100%; background: var(--field-bg); border: 1px solid var(--field-border); border-radius: 10px; padding: 13px 14px; font-size: 17px; font-family: inherit; color: var(--ink); resize: none; }
  textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent); }
  .note-view { background: var(--paper); border-radius: 10px; padding: 12px 14px; margin: 0; white-space: pre-wrap; }
  .field { margin-bottom: 18px; }
  .btn-outline, .btn-whatsapp, .btn-danger {
    display: flex; align-items: center; justify-content: center; width: 100%; height: 48px; border-radius: 10px;
    font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; margin-top: 10px; text-decoration: none;
  }
  .btn-outline { background: #fff; color: var(--ink); border: 1px solid var(--field-border); }
  .btn-whatsapp { background: #2fae60; color: #fff; border: none; font-weight: 700; }
  .btn-danger { background: #fff; color: var(--danger); border: 1px solid rgba(122,46,46,.35); }
  button:disabled { opacity: 0.45; cursor: default; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; margin: 14px 0 0; }
  .msg { font-size: 14px; text-align: center; margin: 10px 0 0; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: #1d6b3a; }
  .contact { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); text-align: center; font-size: 14px; color: var(--ink-soft); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="header-band">
  <div class="title-row">
    <h1 class="venue-name"><img class="venue-logo" src="assets/izazoo-logo-red.png" alt="IZAZOO" width="168" height="24"></h1>
    <span class="slash-big">//</span>
    <span class="venue-tag">ההזמנה שלי</span>
  </div>
</div>
<div class="page" id="page"><p style="text-align:center; color:var(--muted);">טוען...</p></div>

<!-- ================= CONFIGURATION ================= -->
<script>
  const SUPABASE_URL = "https://brpovhypzsgwsnuenpfj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_FG6kYV7D4D7iDXYYHGrysw_bJ-ag_0e";
  const BUSINESS_NAME = "עיזה בר";
  // The bar can't be reached by phone, only by WhatsApp (or Facebook / Instagram messages)
  const BAR_WHATSAPP = "972587460202";
  // Public half of the notification keys (the private half is only on the server)
  const VAPID_PUBLIC = "BHdpuZjwMDxA8ns-lmmI4lujkUbgB3L8YBT9pobeVK3P2W9jJsGAQfN4jLHEPeAYnQOXCt0LbQoqBYa6PWTb74o";
</script>
<!-- =================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="card.js"></script>
<script>
// A customer's own booking, reached through the private link booking.html#<secret>.
// The secret sits after '#', so it is never sent to the web host. Everything goes
// through database functions that act on this one booking only (10_booking_link.sql).
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const page = document.getElementById('page');
const token = decodeURIComponent(location.hash.slice(1));
const STATUS = { confirmed: 'ההזמנה אושרה', pending: 'ממתינה לאישור', cancelled: 'ההזמנה בוטלה', declined: 'הבקשה לא אושרה' };
let booking = null, message = null;

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// Same rules as the booking page: arrivals 17:00-21:00 every 15 minutes; for today,
// at least 30 minutes from now (rounded up), and nothing once same-day booking has closed.
let hours = { start: '17:00', end: '21:00', cutoff: '20:00' };
function israelNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jerusalem', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date()).map(x => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, time: `${p.hour}:${p.minute}` };
}
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const toTime = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
function addDays(dateStr, n) { const [y, m, d] = dateStr.split('-').map(Number), x = new Date(y, m - 1, d + n);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; }
function arrivalTimes(date) {
  const now = israelNow();
  let min = toMin(hours.start);
  if (date === now.date) {
    if (now.time >= hours.cutoff) return [];
    min = Math.max(min, Math.ceil((toMin(now.time) + 30) / 15) * 15);
  }
  const out = [];
  for (let m = min; m <= toMin(hours.end); m += 15) out.push(toTime(m));
  return out;
}
async function loadHours() {
  const { data } = await db.from('settings').select('key,value').in('key', ['arrival_start', 'arrival_end', 'booking_cutoff']);
  const v = Object.fromEntries((data || []).map(r => [r.key, r.value]));
  hours = { start: v.arrival_start || hours.start, end: v.arrival_end || hours.end, cutoff: v.booking_cutoff || hours.cutoff };
}

// Notifications (Android, and iPhone only when the site is on the home screen): the phone
// registers sw.js and gives the database its address for this booking; the bar's answer is
// sent by the server function notify-booking.
const PUSH_OK = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const IS_IPHONE = /iPhone|iPad|iPod/i.test(navigator.userAgent);
const pushKey = () => 'izabar_push_' + token;
function pushOn() { try { return localStorage.getItem(pushKey()) === '1'; } catch (e) { return false; } }
function keyBytes(b64) {
  const s = atob((b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(s, c => c.charCodeAt(0));
}
// Waiting for approval: a notification with the bar's answer. Confirmed (owner, Nov 2026):
// a reminder about 2 hours before (sent by the server function send-reminders).
function notifyHtml(b) {
  const pending = b.status === 'pending';
  if (!pending && !(b.status === 'confirmed' && b.can_cancel)) return '';
  if (PUSH_OK) return pushOn()
    ? `<p class="hint" id="pushOn">🔔 ${pending ? 'תקבלו התראה בטלפון כשנאשר' : 'תקבלו תזכורת בטלפון כשעתיים לפני ההגעה'}.</p>`
    : `<button type="button" class="btn-outline" id="pushBtn">🔔 ${pending ? 'קבלו התראה כשנאשר' : 'קבלו תזכורת שעתיים לפני'}</button>`;
  if (IS_IPHONE) return `<p class="hint" id="pushIphone">באייפון התראות עובדות רק אם מוסיפים את האתר למסך הבית. נעדכן אתכם גם בוואטסאפ.</p>`;
  return '';
}
async function enablePush() {
  const btn = document.getElementById('pushBtn');
  btn.disabled = true;
  try {
    if (await Notification.requestPermission() !== 'granted') {
      message = { text: 'ההתראות חסומות בטלפון. אפשר להפעיל אותן בהגדרות הדפדפן, ונעדכן אתכם גם בוואטסאפ.' };
    } else {
      const reg = await navigator.serviceWorker.register('sw.js');
      await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription()
        || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(VAPID_PUBLIC) });
      const j = sub.toJSON();
      const { data, error } = await db.rpc('save_push_subscription',
        { p_token: token, p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
      if (!error && data === 'saved') {
        try { localStorage.setItem(pushKey(), '1'); } catch (e) {}
        message = { ok: true, text: booking.status === 'pending' ? 'מעולה! תקבלו התראה כשנאשר.' : 'מעולה! תקבלו תזכורת בטלפון כשעתיים לפני ההגעה.' };
      } else message = { text: 'לא הצלחנו להפעיל התראות. נעדכן אתכם בוואטסאפ.' };
    }
  } catch (e) {
    message = { text: 'לא הצלחנו להפעיל התראות בטלפון הזה. נעדכן אתכם בוואטסאפ.' };
  }
  booking = null;
  await load();
}

function shortDate(d) { const [, m, day] = d.split('-').map(Number); return `${day}.${m}`; }
const barWhatsApp = text => `https://wa.me/${BAR_WHATSAPP}?text=${encodeURIComponent(text)}`;
const TOKEN_OK = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

async function load(quiet) {
  if (!TOKEN_OK.test(token)) return showNotFound();
  const { data, error } = await db.rpc('get_booking', { p_token: token });
  if (error) {
    if (quiet) return;                          // a background refresh keeps what's on screen
    page.innerHTML = `<p class="msg err">אין חיבור לשרת. בדקו את החיבור ונסו שוב.</p><button type="button" class="btn-outline" id="retry">נסו שוב</button>`;
    document.getElementById('retry').addEventListener('click', () => load());
    return;
  }
  const b = data && data[0];
  if (!b) return showNotFound();
  const changed = !booking || ['status', 'note', 'can_change', 'can_cancel', 'reservation_date', 'arrival_time', 'guests', 'prev_date', 'seating']
    .some(k => booking[k] !== b[k]);
  booking = b;
  remember(b);
  // don't redraw under someone typing a comment
  if (quiet && (!changed || document.activeElement?.id === 'noteInput')) return;
  render();
}

// Same list as the booking page's "ההזמנות שלי" (index.html, rememberBooking)
function remember(b) {
  try {
    const key = 'izabar_my_bookings', list = JSON.parse(localStorage.getItem(key)) || [];
    const active = b.status === 'confirmed' || b.status === 'pending';
    const others = list.filter(x => x.token !== token);
    const next = active ? [{ token, date: b.reservation_date, time: b.arrival_time.slice(0, 5), guests: b.guests }, ...others] : others;
    localStorage.setItem(key, JSON.stringify(next.slice(0, 10)));
  } catch (e) { /* private browsing: nothing is remembered */ }
}

function showNotFound() {
  page.innerHTML = `
    <div class="closed-box"><h2>ההזמנה לא נמצאה</h2><p>ייתכן שהקישור לא הועתק במלואו.</p></div>
    <a class="btn-whatsapp" href="${barWhatsApp('שלום, יש לי שאלה לגבי הזמנה')}" target="_blank" rel="noopener">כתבו לנו בוואטסאפ</a>`;
}

function render() {
  const b = booking, active = b.status === 'confirmed' || b.status === 'pending';
  const when = `${shortDate(b.reservation_date)} בשעה ${b.arrival_time.slice(0, 5)}`;
  page.innerHTML = `
    <p class="status"><span class="s-${esc(b.status)}" id="statusLabel">${STATUS[b.status] || ''}</span></p>
    ${active
      ? `<img class="card-preview" id="cardPreview" alt="${STATUS[b.status]}: ${esc(b.customer_name)}, ${placeText(b.seating, b.guests)}, ${when}" hidden>`
      : `<div class="closed-box"><h2>${STATUS[b.status]}</h2><p>${esc(b.customer_name)}, ${placeText(b.seating, b.guests)}</p><p>${when}</p></div>`}
    ${message ? `<p class="msg ${message.ok ? 'ok' : 'err'}" id="msg">${message.text}</p>` : ''}
    ${notifyHtml(b)}
    ${b.status === 'pending' && b.prev_date ? `<p class="pending-note" id="pendingNote">השינוי ממתין לאישור. אם לא יאושר, נשארת ההזמנה המקורית:
      ${shortDate(b.prev_date)} בשעה ${b.prev_time.slice(0, 5)}, ${b.prev_guests} סועדים.</p>` : ''}
    ${b.can_change ? `
      <div class="change-box">
        <p class="section-title">שינוי פרטי ההזמנה</p>
        <div class="change-grid">
          <div class="field"><label for="dateInput">תאריך</label>
            <input type="date" id="dateInput" value="${b.reservation_date}" min="${israelNow().date}" max="${addDays(israelNow().date, 30)}"></div>
          <div class="field"><label for="timeInput">שעה</label><select id="timeInput"></select></div>
          <div class="field"><label for="seatingInput">איפה</label><select id="seatingInput">
            <option value="table" ${b.seating !== 'bar' ? 'selected' : ''}>שולחן</option>
            <option value="bar" ${b.seating === 'bar' ? 'selected' : ''}>בר</option></select></div>
          <div class="field"><label for="guestsInput">סועדים</label><select id="guestsInput">
            ${Array.from({ length: 10 }, (_, i) => `<option value="${i + 1}" ${i + 1 === b.guests ? 'selected' : ''}>${i + 1}</option>`).join('')}</select></div>
        </div>
        <p class="msg err" id="barLimit" hidden>בבר אפשר עד 4 סועדים. הקטינו את מספר הסועדים או בחרו שולחן.</p>
        <button type="button" class="btn-outline" id="saveChange">שמירת השינויים</button>
      </div>
      <div class="field">
        <label for="noteInput">הערה להזמנה</label>
        <textarea id="noteInput" rows="2" maxlength="300" placeholder="לדוגמה: יום הולדת, כיסא תינוק...">${esc(b.note)}</textarea>
      </div>
      <button type="button" class="btn-outline" id="saveNote">שמירת ההערה</button>`
      : b.note ? `<div class="field"><label>הערה להזמנה</label><p class="note-view">${esc(b.note)}</p></div>` : ''}
    ${active ? `<a class="btn-outline" id="sendLink" href="https://wa.me/?text=${encodeURIComponent(`ההזמנה שלי ל${BUSINESS_NAME} - ${when}\nלצפייה, שינוי או ביטול: ${location.href}`)}" target="_blank" rel="noopener">שליחת הקישור לוואטסאפ שלי</a>` : ''}
    ${b.can_cancel ? `<button type="button" class="btn-danger" id="cancelBtn">ביטול ההזמנה</button>` : ''}
    ${active && !b.can_change ? `<p class="hint">אפשר לשנות פרטים עד שעה לפני ההגעה. לשינויים כתבו לנו בוואטסאפ.</p>` : ''}
    <div class="contact">
      לשאלות ולשינויים אפשר לכתוב לנו
      <a class="btn-whatsapp" id="barWa" href="${barWhatsApp(`שלום, לגבי ההזמנה שלי (מספר ${b.id}) ל-${when}`)}" target="_blank" rel="noopener">וואטסאפ לעיזה בר</a>
    </div>`;
  message = null;
  if (active) drawCard();
  document.getElementById('saveNote')?.addEventListener('click', saveNote);
  document.getElementById('pushBtn')?.addEventListener('click', enablePush);
  if (b.can_change) {
    fillTimes(b.arrival_time.slice(0, 5));
    for (const id of ['seatingInput', 'guestsInput']) document.getElementById(id).addEventListener('change', checkBarLimit);
    document.getElementById('dateInput').addEventListener('change', () => fillTimes(document.getElementById('timeInput').value));
    document.getElementById('saveChange').addEventListener('click', saveChange);
  }
  document.getElementById('cancelBtn')?.addEventListener('click', cancelBooking);
}

async function drawCard() {
  try { await document.fonts.load('900 100px Heebo'); } catch (e) {}
  const img = document.getElementById('cardPreview');
  if (!img) return;
  try {
    const canvas = document.createElement('canvas');
    drawBookingCard(canvas, { business: BUSINESS_NAME, name: booking.customer_name, guests: booking.guests,
      time: booking.arrival_time.slice(0, 5), date: booking.reservation_date, bookingId: booking.id, pending: booking.status === 'pending',
      seating: booking.seating });
    img.src = canvas.toDataURL('image/png'); img.hidden = false;
  } catch (e) { /* the status line and buttons are enough without the picture */ }
}

// The bar takes groups of 1-4. The number is never changed for the customer (owner, Nov 2026):
// a bigger group choosing the bar sees why, and saving waits until they lower it or choose a table.
function checkBarLimit() {
  const over = document.getElementById('seatingInput').value === 'bar' && Number(document.getElementById('guestsInput').value) > 4;
  document.getElementById('barLimit').hidden = !over;
  document.getElementById('saveChange').disabled = over || !document.getElementById('timeInput').value;
}

function fillTimes(keep) {
  const date = document.getElementById('dateInput').value, times = arrivalTimes(date), sel = document.getElementById('timeInput');
  sel.innerHTML = times.length ? times.map(t => `<option ${t === keep ? 'selected' : ''}>${t}</option>`).join('')
    : '<option value="">אין שעות</option>';
  document.getElementById('saveChange').disabled = !times.length;
  if (document.getElementById('barLimit')) checkBarLimit();
}

async function saveChange() {
  const date = document.getElementById('dateInput').value, time = document.getElementById('timeInput').value;
  const guests = Number(document.getElementById('guestsInput').value);
  const seating = document.getElementById('seatingInput').value;
  if (!date || !time) return;
  const wasConfirmed = booking.status === 'confirmed';
  const btn = document.getElementById('saveChange');
  btn.disabled = true; btn.textContent = 'שומר...';
  const { data, error } = await db.rpc('change_booking', { p_token: token, p_date: date, p_time: time, p_guests: guests, p_seating: seating });
  const texts = {
    confirmed: { ok: true, text: 'השינוי נשמר ואושר.' },
    pending: { ok: true, text: wasConfirmed ? 'השינוי נשלח לאישור. נעדכן אתכם בוואטסאפ. עד אז ההזמנה המקורית שמורה לכם.'
                                            : 'הבקשה עודכנה וממתינה לאישור. נעדכן אתכם בוואטסאפ.' },
    unchanged: { text: 'לא שיניתם כלום.' },
    full: { text: 'אין מקום מתאים בשינוי הזה. ההזמנה נשארה כמו שהייתה.' },
    duplicate: { text: 'כבר יש הזמנה אחרת על מספר הטלפון הזה בערב הזה. ההזמנה נשארה כמו שהייתה.' },
    bar_available: { text: 'אין שולחן פנוי בשינוי הזה, אבל יש מקום בבר: בחרו "בר" ושמרו שוב. ההזמנה נשארה כמו שהייתה.' },
    closed: { text: 'אי אפשר להזמין להיום אחרי 20:00. ההזמנה נשארה כמו שהייתה.' },
    invalid_time: { text: 'השעה שבחרתם כבר לא זמינה. בחרו שעה מאוחרת יותר.' },
    locked: { text: 'כבר אי אפשר לשנות את ההזמנה. כתבו לנו בוואטסאפ.' }
  };
  message = error ? { text: 'השינוי לא נשמר. בדקו את החיבור ונסו שוב.' } : texts[data] || { text: 'השינוי לא נשמר.' };
  booking = null;
  await load();
}

async function saveNote() {
  const btn = document.getElementById('saveNote');
  btn.disabled = true; btn.textContent = 'שומר...';
  const { data, error } = await db.rpc('update_booking_note', { p_token: token, p_note: document.getElementById('noteInput').value });
  message = error ? { text: 'ההערה לא נשמרה. בדקו את החיבור ונסו שוב.' }
    : data === 'saved' ? { ok: true, text: 'ההערה נשמרה.' }
    : data === 'locked' ? { text: 'כבר אי אפשר לשנות את ההזמנה. כתבו לנו בוואטסאפ.' }
    : { text: 'ההערה לא נשמרה.' };
  booking = null;                       // force a redraw with the latest data
  await load();
}

async function cancelBooking() {
  if (!confirm('לבטל את ההזמנה? השולחן ישתחרר.')) return;
  const btn = document.getElementById('cancelBtn');
  btn.disabled = true; btn.textContent = 'מבטל...';
  const { data, error } = await db.rpc('cancel_booking', { p_token: token });
  message = error ? { text: 'הביטול לא נשמר. בדקו את החיבור ונסו שוב.' }
    : data === 'cancelled' ? { ok: true, text: 'ההזמנה בוטלה. נשמח לראות אתכם בפעם אחרת!' }
    : { text: 'אי אפשר לבטל את ההזמנה הזו. כתבו לנו בוואטסאפ.' };
  booking = null;
  await load();
}

// the status changes when the bar answers: check every 30 seconds while the page is open
setInterval(() => { if (document.visibilityState === 'visible') load(true); }, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(true); });
window.addEventListener('hashchange', () => location.reload());
loadHours().finally(() => load());
</script>
